<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Attorneys</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#17132b;
}

button,
input{
  font:inherit;
}

/* =========================
   MENU
========================= */

#menu{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,#48347c 0%,#211638 45%,#100c1b 100%);
  color:white;
  padding:20px;
}

.menu-box{
  width:min(500px,94vw);
  padding:30px;
  border-radius:25px;
  background:rgba(20,15,35,.94);
  border:3px solid rgba(255,255,255,.15);
  box-shadow:0 20px 70px rgba(0,0,0,.5);
  text-align:center;
}

.menu-box h1{
  font-size:42px;
  margin-bottom:8px;
}

.menu-box p{
  color:#cfc8e9;
  margin-bottom:25px;
}

.menu-box input[type="text"]{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  outline:none;
  margin-bottom:15px;
  background:#2e2646;
  color:white;
}

.file-label{
  display:block;
  padding:14px;
  border-radius:12px;
  background:#403260;
  cursor:pointer;
  margin-bottom:15px;
}

.file-label:hover{
  background:#55417e;
}

#playerImageInput{
  display:none;
}

#previewArea{
  display:none;
  margin:15px auto;
}

#previewArea.show{
  display:block;
}

#playerPreview{
  width:100px;
  height:120px;
  object-fit:contain;
  image-rendering:auto;
  border-radius:15px;
  background:rgba(255,255,255,.05);
}

#fileName{
  display:block;
  margin-top:7px;
  font-size:12px;
  color:#aaa;
  word-break:break-word;
}

#startGame{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  cursor:pointer;
  background:#a97cff;
  color:white;
  font-weight:bold;
  font-size:18px;
}

#startGame:hover{
  background:#b994ff;
}

/* =========================
   GAME
========================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#82b95f;
}

#world{
  position:absolute;
  left:0;
  top:0;
  width:3600px;
  height:2600px;
  transform-origin:top left;
  will-change:transform;
}

/* =========================
   CHÃO
========================= */

#island{
  position:absolute;
  left:0;
  top:0;
  width:3600px;
  height:2600px;
  overflow:hidden;
  background:#8fc66b;
  z-index:0;
}

#grass{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
  user-select:none;
}

/* camada natural sobre o chão */
.ground-overlay{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 25%,rgba(255,255,255,.06) 0 3px,transparent 4px),
    radial-gradient(circle at 72% 65%,rgba(40,80,30,.05) 0 4px,transparent 5px),
    radial-gradient(circle at 40% 80%,rgba(255,255,255,.04) 0 3px,transparent 4px);
  background-size:180px 180px,230px 230px,200px 200px;
}

/* =========================
   CAMINHOS
========================= */

.path{
  position:absolute;
  z-index:2;
  background:#d7bd83;
  border-radius:999px;
  opacity:.95;
}

.path.one{
  width:2800px;
  height:150px;
  left:400px;
  top:1210px;
  transform:rotate(-4deg);
}

.path.two{
  width:150px;
  height:2100px;
  left:1725px;
  top:250px;
  transform:rotate(5deg);
}

.path.three{
  width:1200px;
  height:120px;
  left:800px;
  top:700px;
  transform:rotate(18deg);
}

/* =========================
   NATUREZA
========================= */

.pond{
  position:absolute;
  z-index:2;
  border-radius:50%;
  background:#6db4d5;
  border:8px solid rgba(255,255,255,.18);
  box-shadow:inset 0 0 0 8px rgba(30,100,130,.12);
}

.pond.one{
  width:420px;
  height:260px;
  left:250px;
  top:300px;
}

.pond.two{
  width:500px;
  height:280px;
  right:250px;
  bottom:260px;
}

.bush{
  position:absolute;
  z-index:3;
  width:120px;
  height:75px;
  border-radius:60%;
  background:#4f963f;
  box-shadow:
    25px -15px 0 #5ba847,
    55px 0 0 #478d38,
    80px -12px 0 #5aa444;
}

.bush.b1{left:300px;top:850px}
.bush.b2{left:2950px;top:450px}
.bush.b3{left:2850px;top:1850px}
.bush.b4{left:450px;top:2100px}
.bush.b5{left:1450px;top:400px}
.bush.b6{left:2200px;top:2050px}

.rock{
  position:absolute;
  z-index:3;
  width:80px;
  height:55px;
  border-radius:50% 55% 45% 50%;
  background:#77756c;
  box-shadow:inset 10px 8px 0 rgba(255,255,255,.15);
}

.rock.r1{left:950px;top:350px}
.rock.r2{left:2550px;top:500px}
.rock.r3{left:3000px;top:1300px}
.rock.r4{left:750px;top:2200px}
.rock.r5{left:2100px;top:400px}

/* =========================
   NPCS
========================= */

.npc{
  position:absolute;
  z-index:30;
  width:150px;
  height:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:filter .15s,transform .15s;
}

.npc img{
  max-width:150px;
  max-height:125px;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}

.npc-name{
  position:absolute;
  left:50%;
  top:-8px;
  transform:translate(-50%,-100%);
  white-space:nowrap;
  padding:6px 10px;
  border-radius:10px;
  background:rgba(20,15,35,.85);
  color:white;
  font-size:14px;
  font-weight:bold;
  pointer-events:none;
}

.npc.near{
  filter:drop-shadow(0 0 12px #fff);
  transform:scale(1.06);
}

/* posições */

#burguinho{
  left:560px;
  top:1060px;
}

#yume{
  left:900px;
  top:470px;
}

#melanie{
  left:1200px;
  top:1250px;
}

#oliver{
  left:2250px;
  top:1200px;
}

#rick{
  left:650px;
  top:1750px;
}

#morty{
  left:850px;
  top:1850px;
}

#robot{
  left:1900px;
  top:700px;
}

#jotaro{
  left:2700px;
  top:1150px;
}

/* =========================
   PLAYER
========================= */

#playerCharacter{
  position:absolute;
  z-index:50;
  width:104px;
  height:124px;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  image-rendering:auto;
  filter:drop-shadow(0 5px 3px rgba(0,0,0,.3));
}

#playerNameTag{
  position:absolute;
  z-index:60;
  transform:translateX(-50%);
  white-space:nowrap;
  padding:5px 9px;
  border-radius:9px;
  background:rgba(20,15,35,.9);
  color:white;
  font-weight:bold;
  font-size:14px;
  pointer-events:none;
}

/* =========================
   HUD
========================= */

#top-left{
  position:fixed;
  z-index:500;
  left:15px;
  top:15px;
  padding:10px 14px;
  border-radius:12px;
  background:rgba(20,15,35,.82);
  color:white;
  font-weight:bold;
}

#timer{
  position:fixed;
  z-index:500;
  left:50%;
  top:15px;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:14px;
  background:rgba(20,15,35,.82);
  color:white;
  font-weight:bold;
}

/* =========================
   CHAT
========================= */

#chat{
  position:fixed;
  z-index:500;
  left:15px;
  bottom:15px;
  width:min(360px,90vw);
  background:rgba(20,15,35,.88);
  border-radius:16px;
  padding:12px;
  color:white;
}

#chatLog{
  height:110px;
  overflow-y:auto;
  font-size:13px;
  line-height:1.5;
  margin-bottom:8px;
}

.chat-row{
  display:flex;
  gap:7px;
}

#chatInput{
  min-width:0;
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
  outline:none;
}

#chatSend{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  cursor:pointer;
}

/* =========================
   INTERAÇÃO
========================= */

#interact{
  position:fixed;
  z-index:600;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  display:none;
  border:0;
  border-radius:14px;
  padding:13px 25px;
  background:#a97cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.3);
}

#interact:hover{
  background:#bb98ff;
}

/* =========================
   DIÁLOGO
========================= */

#dialog{
  position:fixed;
  z-index:1000;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.95);
  width:min(520px,90vw);
  max-height:90vh;
  overflow:auto;
  padding:22px;
  border-radius:22px;
  background:rgba(25,19,42,.97);
  border:2px solid rgba(255,255,255,.15);
  color:white;
  box-shadow:0 20px 80px rgba(0,0,0,.55);
  opacity:0;
  pointer-events:none;
  transition:.18s ease;
}

#dialog.show{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%) scale(1);
}

#dialogTitle{
  font-size:24px;
  margin-bottom:10px;
}

#dialogText{
  color:#ddd7ee;
  line-height:1.5;
  margin-bottom:15px;
}

#audioContainer{
  margin-top:10px;
  display:flex;
  justify-content:center;
}

#audioContainer iframe{
  width:110px;
  height:200px;
  border:0;
  border-radius:10px;
}

.dialog-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.dialog-buttons button{
  border:0;
  border-radius:11px;
  padding:10px 15px;
  cursor:pointer;
  color:white;
  background:#55417e;
}

.dialog-buttons button:hover{
  background:#6b5299;
}

/* =========================
   MOBILE
========================= */

#mobileControls{
  position:fixed;
  z-index:700;
  right:15px;
  bottom:20px;
  display:grid;
  grid-template-columns:repeat(3,52px);
  grid-template-rows:repeat(2,52px);
  gap:7px;
}

#mobileControls button{
  border:0;
  border-radius:14px;
  background:rgba(20,15,35,.75);
  color:white;
  font-size:21px;
  touch-action:none;
}

#mobileControls button[data-key="ArrowUp"]{
  grid-column:2;
}

#mobileControls button[data-key="ArrowLeft"]{
  grid-column:1;
  grid-row:2;
}

#mobileControls button[data-key="ArrowDown"]{
  grid-column:2;
  grid-row:2;
}

#mobileControls button[data-key="ArrowRight"]{
  grid-column:3;
  grid-row:2;
}

@media(max-width:700px){

  .menu-box{
    padding:22px;
  }

  .menu-box h1{
    font-size:32px;
  }

  #chat{
    width:230px;
  }

  #chatLog{
    height:75px;
  }

  #playerCharacter{
    width:90px;
    height:108px;
  }

  .npc{
    width:125px;
    height:125px;
  }

  .npc img{
    max-width:125px;
    max-height:110px;
  }

  .npc-name{
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

  <div class="menu-box">

    <h1>THE ATTORNEYS</h1>

    <p>
      Entre no lobby e prepare-se para a próxima prova.
    </p>

    <input
      id="playerNameInput"
      type="text"
      maxlength="20"
      placeholder="Nome do jogador"
    >

    <label class="file-label" for="playerImageInput">
      🖼️ Escolher imagem do personagem
    </label>

    <input
      id="playerImageInput"
      type="file"
      accept="image/*"
    >

    <div id="previewArea">
      <img id="playerPreview" alt="Prévia do personagem">
      <span id="fileName"></span>
    </div>

    <button id="startGame">
      ENTRAR NO LOBBY
    </button>

  </div>

</div>


<!-- =========================
     GAME
========================= -->

<div id="game" hidden>

  <div id="world">

    <div id="island">

      <!-- O PNG agora é o chão -->
      <img
        id="grass"
        src="https://wallpapercave.com/wp/wp10944792.png"
        alt=""
      >

      <div class="ground-overlay"></div>

      <!-- caminhos -->
      <div class="path one"></div>
      <div class="path two"></div>
      <div class="path three"></div>

      <!-- água -->
      <div class="pond one"></div>
      <div class="pond two"></div>

      <!-- arbustos -->
      <div class="bush b1"></div>
      <div class="bush b2"></div>
      <div class="bush b3"></div>
      <div class="bush b4"></div>
      <div class="bush b5"></div>
      <div class="bush b6"></div>

      <!-- pedras -->
      <div class="rock r1"></div>
      <div class="rock r2"></div>
      <div class="rock r3"></div>
      <div class="rock r4"></div>
      <div class="rock r5"></div>


      <!-- =========================
           NPC BURGUINHO
      ========================== -->

      <div
        class="npc"
        id="burguinho"
        data-id="burguinho"
      >

        <div class="npc-name">
          Burguinho
        </div>

        <img
          src="https://png.pngtree.com/png-vector/20241203/ourmid/pngtree-duck-animal-png-image_14602800.png"
          alt="Burguinho"
        >

      </div>


      <!-- =========================
           NPC YUME
      ========================== -->

      <div
        class="npc"
        id="yume"
        data-id="yume"
      >

        <div class="npc-name">
          Yume
        </div>

        <img
          src="https://static.wikia.nocookie.net/melanie-martinez/images/f/f5/Circle_-_in_-_stop_-_motion.webp/revision/latest/scale-to-width-down/250?cb=20260603173801"
          alt="Yume"
        >

      </div>


      <!-- =========================
           MELANIE
      ========================== -->

      <div
        class="npc"
        id="melanie"
        data-id="melanie"
      >

        <div class="npc-name">
          Melanie
        </div>

        <img
          src="https://i.pinimg.com/736x/a1/26/60/a12660f3c13e52558b47d0fc39963556.jpg"
          alt="Melanie Martinez"
        >

      </div>


      <!-- =========================
           OLIVER
      ========================== -->

      <div
        class="npc"
        id="oliver"
        data-id="oliver"
      >

        <div class="npc-name">
          Oliver Tree
        </div>

        <img
          src="https://i.pinimg.com/736x/c7/f3/7f/c7f37f8a6488b8f5fd78eb124e1d5b7d.jpg"
          alt="Oliver Tree"
        >

      </div>


      <!-- =========================
           RICK
      ========================== -->

      <div
        class="npc"
        id="rick"
        data-id="rick"
      >

        <div class="npc-name">
          Rick
        </div>

        <img
          src="https://pngimg.com/uploads/rick_morty/rick_morty_PNG8.png"
          alt="Rick"
        >

      </div>


      <!-- =========================
           MORTY
      ========================== -->

      <div
        class="npc"
        id="morty"
        data-id="morty"
      >

        <div class="npc-name">
          Morty
        </div>

        <img
          src="https://pngimg.com/uploads/rick_morty/morty_PNG18.png"
          alt="Morty"
        >

      </div>


      <!-- =========================
           ROBÔ
      ========================== -->

      <div
        class="npc"
        id="robot"
        data-id="robot"
      >

        <div class="npc-name">
          Robô de Informações
        </div>

        <img
          src="https://pngimg.com/uploads/robot/robot_PNG96.png"
          alt="Robô"
        >

      </div>


      <!-- =========================
           JOTARO
      ========================== -->

      <div
        class="npc"
        id="jotaro"
        data-id="jotaro"
      >

        <div class="npc-name">
          Jotaro
        </div>

        <img
          src="https://static.wikia.nocookie.net/shonenheroes/images/4/4b/Jotaro_Kujo.png/revision/latest?cb=20231223053813"
          alt="Jotaro Kujo"
        >

      </div>


      <!-- =========================
           PLAYER
      ========================== -->

      <img
        id="playerCharacter"
        alt="Seu personagem"
      >

      <div id="playerNameTag">
        Jogador
      </div>

    </div>

  </div>


  <!-- =========================
       HUD
  ========================== -->

  <div id="top-left">
    Jogador
  </div>

  <div id="timer">
    Explore a ilha
  </div>


  <!-- =========================
       CHAT
  ========================== -->

  <div id="chat">

    <div id="chatLog">
      <b>Sistema:</b> Bem-vindo ao lobby!
    </div>

    <div class="chat-row">

      <input
        id="chatInput"
        type="text"
        maxlength="150"
        placeholder="Digite uma mensagem..."
      >

      <button id="chatSend">
        Enviar
      </button>

    </div>

  </div>


  <!-- =========================
       INTERAGIR
  ========================== -->

  <button id="interact">
    ✨ INTERAGIR
  </button>


  <!-- =========================
       DIÁLOGO
  ========================== -->

  <div id="dialog">

    <div id="dialogTitle">
      NPC
    </div>

    <div id="dialogText">
      Olá!
    </div>

    <div id="audioContainer"></div>

    <div class="dialog-buttons">

      <button
        id="replayAudio"
        style="display:none;"
      >
        🔊 Repetir áudio
      </button>

      <button id="closeDialog">
        Fechar
      </button>

    </div>

  </div>


  <!-- =========================
       CONTROLES MOBILE
  ========================== -->

  <div id="mobileControls">

    <button data-key="ArrowUp">
      ▲
    </button>

    <button data-key="ArrowLeft">
      ◀
    </button>

    <button data-key="ArrowDown">
      ▼
    </button>

    <button data-key="ArrowRight">
      ▶
    </button>

  </div>

</div>


<script>

========================= */

const $ = id => document.getElementById(id);

const world = $("world");

      src="https://www.myinstants.com/instant/full-powerrobotic-voice/embed/"
      frameborder="0"

    </iframe>`,

    `<iframe
      width="110"

      src="https://www.myinstants.com/instant/full-powerrobotic-voice/embed/"
      frameborder="0"
      scrolling="no"
      allow="autoplay">
    </iframe>`

};


/* =========================
   ESCOLHER PLAYER
========================= */

$("playerImageInput").addEventListener(
  "change",
  e => {

    const f = e.target.files[0];

    if(
      !f ||
      !f.type.startsWith("image/")
    ){
      return;
    }

    const r = new FileReader();

    r.onload = () => {

      playerImage = r.result;

      $("playerPreview").src =
        playerImage;

      $("previewArea")
        .classList
        .add("show");

      $("fileName")
        .textContent = f.name;

    };

    r.readAsDataURL(f);

  }
);


/* =========================
   COMEÇAR
========================= */

$("startGame").onclick = () => {

  player.src =
    playerImage ||
    "data:image/svg+xml;charset=utf-8," +
    encodeURIComponent(
      `
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="100"
        height="120"
      >
        <text
          x="50"
          y="75"
          text-anchor="middle"
          font-size="65"
        >
          🧑
        </text>
      </svg>
      `
    );

  const n =
    $("playerNameInput")
      .value
      .trim() ||
    "Jogador";

  tag.textContent = n;

  $("top-left").textContent = n;

  menu.style.display = "none";

  game.hidden = false;

  running = true;

  requestAnimationFrame(loop);

};


/* =========================
   NPC MAIS PRÓXIMO
========================= */

function nearest(){

  let best = null;

  let dist = Infinity;

  document
    .querySelectorAll(".npc")
    .forEach(n => {

      const d =
        Math.hypot(
          x -
          (
            parseFloat(n.style.left) +
            75
          ),

          y -
          (
            parseFloat(n.style.top) +
            65
          )
        );

      if(d < dist){

        dist = d;

        best = n;

      }

    });

  return dist <= 190
    ? best
    : null;

}


/* =========================
   INTERAGIR
========================= */

function interact(){

  const n = nearest();

  if(!n){

    dialog
      .classList
      .remove("show");

    return;

  }

  const id =
    n.dataset.id;

  dialogTitle.textContent =
    n.querySelector(
      ".npc-name"
    ).textContent;

  dialogText.textContent =
    texts[id] ||
    "Olá!";

  const audioContainer =
    $("audioContainer");

  const replayAudio =
    $("replayAudio");

  audioContainer.innerHTML =
    AUDIO_IFRAMES[id] ||
    "";

  replayAudio.style.display =
    AUDIO_IFRAMES[id]
      ? "block"
      : "none";

  dialog
    .classList
    .add("show");

}


/* =========================
   REPETIR ÁUDIO
========================= */

$("replayAudio").onclick = () => {

  const n = nearest();

  if(!n){
    return;
  }

  const id =
    n.dataset.id;

  const audioContainer =
    $("audioContainer");

  audioContainer.innerHTML = "";

  setTimeout(
    () => {

      audioContainer.innerHTML =
        AUDIO_IFRAMES[id] ||
        "";

    },
    50
  );

};


/* =========================
   BOTÃO INTERAGIR
========================= */

nearButton.onclick =
  interact;


/* =========================
   FECHAR DIÁLOGO
========================= */

$("closeDialog").onclick =
  () => {

    dialog
      .classList
      .remove("show");

    $("audioContainer")
      .innerHTML = "";

  };


/* =========================
   CLICAR NO NPC
========================= */

document
  .querySelectorAll(".npc")
  .forEach(n => {

    n.onclick = () => {

      const nx =
        parseFloat(n.style.left) +
        75;

      const ny =
        parseFloat(n.style.top) +
        65;

      if(
        Math.hypot(
          x - nx,
          y - ny
        ) <= 230
      ){

        interact();

      }else{

        dialogTitle.textContent =
          "Muito longe";

        dialogText.textContent =
          "Aproxime-se do personagem para interagir.";

        $("audioContainer")
          .innerHTML = "";

        $("replayAudio")
          .style.display = "none";

        dialog
          .classList
          .add("show");

      }

    };

  });


/* =========================
   TECLADO
========================= */

window.onkeydown = e => {

  const active =
    document.activeElement;

  if(
    active &&
    (
      active.tagName === "INPUT" ||
      active.tagName === "TEXTAREA" ||
      active.isContentEditable
    )
  ){

    return;

  }

  if(
    e.key.toLowerCase() === "e"
  ){

    e.preventDefault();

    interact();

  }

  if(
    [
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      "w",
      "a",
      "s",
      "d",
      "W",
      "A",
      "S",
      "D"
    ].includes(e.key)
  ){

    e.preventDefault();

    keys.add(e.key);

  }

};


window.onkeyup = e => {

  keys.delete(e.key);

};


/* =========================
   CONTROLES MOBILE
========================= */

document
  .querySelectorAll(
    "#mobileControls button"
  )
  .forEach(b => {

    b.onpointerdown = e => {

      e.preventDefault();

      keys.add(
        b.dataset.key
      );

    };

    b.onpointerup = () => {

      keys.delete(
        b.dataset.key
      );

    };

    b.onpointerleave = () => {

      keys.delete(
        b.dataset.key
      );

    };

    b.onpointercancel = () => {

      keys.delete(
        b.dataset.key
      );

    };

  });


/* =========================
   MOVIMENTO
========================= */

function move(){

  let dx = 0;

  let dy = 0;


  if(
    keys.has("ArrowUp") ||
    keys.has("w") ||
    keys.has("W")
  ){

    dy -= speed;

  }


  if(
    keys.has("ArrowDown") ||
    keys.has("s") ||
    keys.has("S")
  ){

    dy += speed;

  }


  if(
    keys.has("ArrowLeft") ||
    keys.has("a") ||
    keys.has("A")
  ){

    dx -= speed;

  }


  if(
    keys.has("ArrowRight") ||
    keys.has("d") ||
    keys.has("D")
  ){

    dx += speed;

  }


  /* diagonal não fica mais rápida */

  if(dx !== 0 && dy !== 0){

    const factor =
      1 / Math.sqrt(2);

    dx *= factor;

    dy *= factor;

  }


  x =
    Math.max(
      180,
      Math.min(
        3420,
        x + dx
      )
    );


  y =
    Math.max(
      160,
      Math.min(
        2440,
        y + dy
      )
    );

}


/* =========================
   ATUALIZAR
========================= */

function update(){

  player.style.left =
    x - 52 + "px";

  player.style.top =
    y - 62 + "px";


  tag.style.left =
    x + "px";

  tag.style.top =
    y - 68 + "px";


  const n =
    nearest();


  document
    .querySelectorAll(".npc")
    .forEach(a => {

      a.classList.toggle(
        "near",
        a === n
      );

    });


  nearButton.style.display =
    n
      ? "block"
      : "none";


  /*
    CÂMERA

    Ela acompanha o player
    para cima, baixo, esquerda
    e direita.
  */

  const w =
    game.clientWidth;

  const h =
    game.clientHeight;


  cameraX =
    Math.max(
      0,
      Math.min(
        3600 - w,
        x - w / 2
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        2600 - h,
        y - h / 2
      )
    );


  world.style.transform =
    `translate(${-cameraX}px,${-cameraY}px)`;

}


/* =========================
   LOOP DO JOGO
========================= */

function loop(){

  if(!running){
    return;
  }

  move();

  update();

  requestAnimationFrame(
    loop
  );

}

   CHAT
========================= */

$("chatSend").onclick =
  () => {

    const input =
      $("chatInput");

    const v =
      input.value.trim();

    if(v){

      $("chatLog").innerHTML +=
        `<br><b>Você:</b> ${
          v.replace(
            /[<>]/g,
            ""
          )
        }`;

      $("chatLog").scrollTop =
        $("chatLog").scrollHeight;

      input.value = "";

    }

  };


/* enviar chat com Enter */

$("chatInput").addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Enter"
    ){

      e.preventDefault();

      $("chatSend").click();

    }

  }
);
