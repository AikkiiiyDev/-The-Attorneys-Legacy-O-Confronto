<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💥 The Attorneys Legacy: O Confronto</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#241536;
}

/* =========================
   JOGO
========================= */

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#241536;
}

#world{
  position:absolute;
  left:0;
  top:0;
  width:5000px;
  height:3500px;
  background:
    radial-gradient(circle at 15% 20%,#6f4194 0 2px,transparent 3px),
    radial-gradient(circle at 70% 70%,#593276 0 2px,transparent 3px),
    #43235f;
  background-size:120px 120px;
  will-change:transform;
}

/* áreas do mapa */

.zone{
  position:absolute;
  border-radius:40px;
  border:5px solid rgba(255,255,255,.12);
  box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.zone.grass{
  background:#628c62;
}

.zone.purple{
  background:#754c91;
}

.zone.blue{
  background:#477b9d;
}

.zone.pink{
  background:#9b5d83;
}

.zone.dark{
  background:#35304e;
}

/* caminhos */

.path{
  position:absolute;
  background:#b79772;
  border-radius:50px;
  opacity:.95;
}

/* lago */

.lake{
  position:absolute;
  background:#4386a5;
  border:10px solid #315b78;
  border-radius:50%;
  box-shadow:inset 0 0 0 8px rgba(255,255,255,.08);
}

/* ilha */

.island{
  position:absolute;
  background:#61865d;
  border:8px solid #456c48;
  border-radius:50%;
}

/* árvores */

.tree{
  position:absolute;
  width:85px;
  height:120px;
}

.tree .trunk{
  position:absolute;
  width:25px;
  height:55px;
  left:30px;
  bottom:0;
  background:#70472f;
  border-radius:10px;
}

.tree .leaves{
  position:absolute;
  width:80px;
  height:80px;
  left:2px;
  top:5px;
  border-radius:50%;
  background:#315c42;
  box-shadow:
    25px -12px 0 #3f714c,
    45px 10px 0 #294d39,
    10px 20px 0 #477a4d;
}

/* flores */

.flower{
  position:absolute;
  width:30px;
  height:30px;
}

.flower span{
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#f3b5dc;
}

.flower span:nth-child(1){left:9px;top:0}
.flower span:nth-child(2){left:18px;top:9px}
.flower span:nth-child(3){left:9px;top:18px}
.flower span:nth-child(4){left:0;top:9px}

.flower i{
  position:absolute;
  width:9px;
  height:9px;
  background:#ffd95e;
  border-radius:50%;
  left:10px;
  top:10px;
}

/* pedras */

.rock{
  position:absolute;
  width:55px;
  height:35px;
  background:#696273;
  border-radius:55% 45% 40% 50%;
  box-shadow:inset 8px 5px rgba(255,255,255,.1);
}

/* placas */

.sign{
  position:absolute;
  padding:12px 20px;
  background:#35253e;
  color:white;
  border:3px solid #9f78ad;
  border-radius:15px;
  font-weight:bold;
  font-size:18px;
}

/* =========================
   JOGADOR
========================= */

#player{
  position:absolute;
  width:70px;
  height:70px;
  z-index:50;
}

.player-body{
  position:absolute;
  width:58px;
  height:58px;
  left:6px;
  top:8px;
  background:#e6c4e9;
  border:5px solid #301c3d;
  border-radius:48% 52% 45% 55%;
}

.player-ear{
  position:absolute;
  width:22px;
  height:25px;
  background:#e6c4e9;
  border:5px solid #301c3d;
  top:0;
  z-index:-1;
}

.player-ear.left{
  left:8px;
  transform:rotate(-25deg);
}

.player-ear.right{
  right:8px;
  transform:rotate(25deg);
}

.eye{
  position:absolute;
  width:10px;
  height:15px;
  background:#301c3d;
  border-radius:50%;
  top:27px;
}

.eye.left{left:19px}
.eye.right{right:19px}

.mouth{
  position:absolute;
  width:18px;
  height:9px;
  border-bottom:4px solid #301c3d;
  border-radius:50%;
  left:20px;
  top:44px;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  left:15px;
  top:15px;
  z-index:200;
  padding:12px 18px;
  background:rgba(31,20,40,.85);
  color:white;
  border:2px solid #9e73b2;
  border-radius:14px;
  backdrop-filter:blur(5px);
}

#hud strong{
  color:#e8baff;
}

#coordinates{
  font-size:12px;
  opacity:.7;
  margin-top:4px;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
  position:fixed;
  left:25px;
  bottom:25px;
  width:135px;
  height:135px;
  border-radius:50%;
  background:rgba(20,15,30,.45);
  border:3px solid rgba(255,255,255,.25);
  z-index:300;
  touch-action:none;
}

#stick{
  position:absolute;
  width:60px;
  height:60px;
  left:37px;
  top:37px;
  border-radius:50%;
  background:#b783c7;
  border:4px solid #e3b5ed;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

/* =========================
   MINIMAPA
========================= */

#minimap{
  position:fixed;
  right:18px;
  top:18px;
  width:170px;
  height:120px;
  background:#382044;
  border:3px solid #a77bb8;
  border-radius:15px;
  z-index:200;
  overflow:hidden;
}

#miniPlayer{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
}

/* =========================
   MENU
========================= */

#menu{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  background:#241536;
}

.menu-box{
  width:min(90%,480px);
  padding:40px;
  background:#39204d;
  border:3px solid #a16bb5;
  border-radius:25px;
  text-align:center;
  color:white;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.menu-box h1{
  font-size:42px;
  color:#efc7ff;
  margin-bottom:10px;
}

.menu-box p{
  opacity:.75;
  margin-bottom:25px;
}

.menu-box button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:#a76fbb;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.menu-box button:hover{
  background:#bc85cf;
}

/* responsivo */

@media(max-width:600px){
  #minimap{
    width:120px;
    height:85px;
  }

  #hud{
    font-size:13px;
  }

  #joystick{
    width:125px;
    height:125px;
  }

  #stick{
    width:56px;
    height:56px;
    left:34px;
    top:34px;
  }
}
</style>
</head>

<script>
/* =========================
   CONFIGURAÇÃO
========================= */

const WORLD_WIDTH = 5000;
const WORLD_HEIGHT = 3500;

const player = document.getElementById("player");
const world = document.getElementById("world");
const coordinates = document.getElementById("coordinates");
const miniPlayer = document.getElementById("miniPlayer");

let playerX = WORLD_WIDTH / 2;
let playerY = WORLD_HEIGHT / 2;

let speed = 6;

const keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

let joystickX = 0;
let joystickY = 0;

/* =========================
   TECLADO
========================= */

document.addEventListener("keydown", e => {

  if(
    e.key === "ArrowUp" ||
    e.key.toLowerCase() === "w"
  ){
    keys.up = true;
  }

  if(
    e.key === "ArrowDown" ||
    e.key.toLowerCase() === "s"
  ){
    keys.down = true;
  }

  if(
    e.key === "ArrowLeft" ||
    e.key.toLowerCase() === "a"
  ){
    keys.left = true;
  }

  if(
    e.key === "ArrowRight" ||
    e.key.toLowerCase() === "d"
  ){
    keys.right = true;
  }

});

document.addEventListener("keyup", e => {

  if(
    e.key === "ArrowUp" ||
    e.key.toLowerCase() === "w"
  ){
    keys.up = false;
  }

  if(
    e.key === "ArrowDown" ||
    e.key.toLowerCase() === "s"
  ){
    keys.down = false;
  }

  if(
    e.key === "ArrowLeft" ||
    e.key.toLowerCase() === "a"
  ){
    keys.left = false;
  }

  if(
    e.key === "ArrowRight" ||
    e.key.toLowerCase() === "d"
  ){
    keys.right = false;
  }

});

/* =========================
   JOYSTICK
========================= */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joystickActive = false;

function moveJoystick(clientX, clientY){

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = clientX - centerX;
  let dy = clientY - centerY;

  const maxDistance = 38;

  const distance = Math.sqrt(dx * dx + dy * dy);

  if(distance > maxDistance){

    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;

  }

  joystickX = dx / maxDistance;
  joystickY = dy / maxDistance;

  stick.style.transform =
    `translate(${dx}px,${dy}px)`;
}

function resetJoystick(){

  joystickActive = false;

  joystickX = 0;
  joystickY = 0;

  stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerdown", e => {

  joystickActive = true;

  joystick.setPointerCapture(e.pointerId);

  moveJoystick(e.clientX,e.clientY);

});

joystick.addEventListener("pointermove", e => {

  if(!joystickActive) return;

  moveJoystick(e.clientX,e.clientY);

});

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

/* =========================
   MOVIMENTO
========================= */

function update(){

  let dx = 0;
  let dy = 0;

  if(keys.left) dx -= 1;
  if(keys.right) dx += 1;
  if(keys.up) dy -= 1;
  if(keys.down) dy += 1;

  dx += joystickX;
  dy += joystickY;

  const length = Math.sqrt(dx * dx + dy * dy);

  if(length > 0){

    dx /= length;
    dy /= length;

    playerX += dx * speed;
    playerY += dy * speed;

  }

  /* limites do mapa */

  playerX = Math.max(
    35,
    Math.min(WORLD_WIDTH - 35, playerX)
  );

  playerY = Math.max(
    35,
    Math.min(WORLD_HEIGHT - 35, playerY)
  );

  updateCamera();

  requestAnimationFrame(update);
}

/* =========================
   CÂMERA
========================= */

function updateCamera(){

  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;

  let cameraX =
    playerX - screenWidth / 2;

  let cameraY =
    playerY - screenHeight / 2;

  cameraX = Math.max(
    0,
    Math.min(
      WORLD_WIDTH - screenWidth,
      cameraX
    )
  );

  cameraY = Math.max(
    0,
    Math.min(
      WORLD_HEIGHT - screenHeight,
      cameraY
    )
  );

  world.style.transform =
    `translate3d(${-cameraX}px,${-cameraY}px,0)`;

  player.style.left =
    `${playerX - 35}px`;

  player.style.top =
    `${playerY - 35}px`;

  coordinates.textContent =
    `X: ${Math.round(playerX)} | Y: ${Math.round(playerY)}`;

  /* minimapa */

  const mapWidth = 170;
  const mapHeight = 120;

  miniPlayer.style.left =
    `${(playerX / WORLD_WIDTH) * mapWidth}px`;

  miniPlayer.style.top =
    `${(playerY / WORLD_HEIGHT) * mapHeight}px`;
}

/* =========================
   BOTÃO
========================= */

document.getElementById("playButton").addEventListener(
  "click",
  () => {

    document.getElementById("menu").style.display = "none";

  }
);

/* =========================
   INICIAR
========================= */

updateCamera();
update();

</script>
