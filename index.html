<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Attorneys</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#171021;
  font-family:Arial,sans-serif;
}

button,input{
  font-family:inherit;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#171021;
}

#camera{
  position:absolute;
  inset:0;
  overflow:hidden;
}

#world{
  position:absolute;
  width:3600px;
  height:2600px;
  left:0;
  top:0;
  will-change:transform;
}

#grass{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

#ground{
  position:absolute;
  inset:0;
  z-index:1;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.08),transparent 18%),
    radial-gradient(circle at 80% 70%,rgba(0,0,0,.08),transparent 25%),
    rgba(71,130,57,.15);
  pointer-events:none;
}

/* CAMINHOS */

.path{
  position:absolute;
  z-index:2;
  background:#d4b477;
  border:7px solid rgba(89,66,39,.45);
  border-radius:120px;
  box-shadow:inset 0 0 0 6px rgba(255,245,190,.22);
}

.path1{
  width:2900px;
  height:230px;
  left:350px;
  top:1080px;
  transform:rotate(-2deg);
}

.path2{
  width:230px;
  height:1900px;
  left:1685px;
  top:350px;
}

/* ÁGUA */

.pond{
  position:absolute;
  z-index:2;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#a7edff,transparent 18%),
    linear-gradient(#39bde4,#197ab3);
  border:13px solid #e6ce8b;
  box-shadow:0 12px 0 rgba(30,55,30,.2);
}

.pond1{
  width:510px;
  height:330px;
  left:350px;
  top:300px;
}

.pond2{
  width:570px;
  height:350px;
  right:350px;
  bottom:300px;
}

/* DECORAÇÃO */

.tree{
  position:absolute;
  z-index:4;
  width:130px;
  height:170px;
}

.tree .leaf{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#397d38;
  top:0;
  left:20px;
  box-shadow:
    35px 12px 0 #4c8e42,
    -22px 25px 0 #316c34;
}

.tree .trunk{
  position:absolute;
  width:32px;
  height:80px;
  background:#744b2a;
  left:50px;
  top:75px;
  border-radius:8px;
}

.flower{
  position:absolute;
  z-index:3;
  font-size:42px;
}

.rock{
  position:absolute;
  z-index:3;
  width:70px;
  height:40px;
  border-radius:50%;
  background:#707169;
  border:5px solid #565850;
}

/* PORTAL */

#portal{
  position:absolute;
  z-index:50;
  left:1660px;
  top:875px;
  width:280px;
  height:430px;
  cursor:pointer;
}

#portalRing{
  position:absolute;
  left:15px;
  top:25px;
  width:250px;
  height:360px;
  border-radius:50%;
  border:20px solid #7055ff;
  background:
    radial-gradient(ellipse,#e9caff 0%,#805dff 30%,#271358 68%,#080412 100%);
  box-shadow:
    0 0 25px #765cff,
    0 0 70px rgba(110,70,255,.75),
    inset 0 0 35px #10052e;
  opacity:.95;
  animation:portalFloat 1.4s infinite alternate;
}

#portalCore{
  position:absolute;
  left:65px;
  top:65px;
  width:150px;
  height:300px;
  border-radius:50%;
  background:
    radial-gradient(ellipse,#fff 0%,#d9aaff 10%,#704cff 35%,#190936 75%);
  animation:portalCore 1s infinite alternate;
}

#portalLabel{
  position:absolute;
  top:-35px;
  width:100%;
  text-align:center;
  color:white;
  font-size:21px;
  font-weight:1000;
  text-shadow:0 4px 0 #24164d;
}

#portalState{
  position:absolute;
  bottom:-20px;
  width:100%;
  text-align:center;
  color:#ffe87b;
  font-weight:1000;
  text-shadow:0 3px 0 #27183f;
}

@keyframes portalFloat{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}

@keyframes portalCore{
  from{transform:scale(.96)}
  to{transform:scale(1.04)}
}

/* NPC */

.npc{
  position:absolute;
  z-index:30;
  width:150px;
  height:190px;
  cursor:pointer;
}

.npcImage{
  position:absolute;
  left:15px;
  bottom:20px;
  width:120px;
  height:130px;
  object-fit:contain;
  filter:drop-shadow(0 8px 4px rgba(0,0,0,.3));
  pointer-events:none;
}

.npcName{
  position:absolute;
  z-index:3;
  left:50%;
  transform:translateX(-50%);
  top:-4px;
  padding:7px 12px;
  border-radius:12px;
  background:rgba(24,15,39,.94);
  color:white;
  border:2px solid white;
  white-space:nowrap;
  font-size:14px;
  font-weight:1000;
  pointer-events:none;
}

.npc.near .npcImage{
  filter:
    drop-shadow(0 8px 4px rgba(0,0,0,.3))
    drop-shadow(0 0 15px #fff16e);
}

.npcFallback{
  position:absolute;
  left:25px;
  bottom:30px;
  width:100px;
  height:100px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:65px;
}

/* PLAYER */

#player{
  position:absolute;
  z-index:40;
  width:140px;
  height:180px;
  pointer-events:none;
}

#playerImage{
  position:absolute;
  width:125px;
  height:135px;
  left:8px;
  bottom:20px;
  object-fit:contain;
  filter:drop-shadow(0 8px 4px rgba(0,0,0,.35));
}

#playerFallback{
  position:absolute;
  left:0;
  bottom:15px;
  width:140px;
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
}

#playerName{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:0;
  padding:7px 12px;
  border-radius:12px;
  background:#241631;
  border:2px solid white;
  color:white;
  white-space:nowrap;
  font-size:14px;
  font-weight:1000;
}

/* HUD */

#hud{
  position:fixed;
  z-index:200;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hudBox{
  padding:11px 16px;
  background:rgba(27,18,44,.92);
  color:white;
  border:2px solid rgba(255,255,255,.3);
  border-radius:15px;
  font-weight:1000;
  box-shadow:0 5px 0 rgba(0,0,0,.25);
}

#timer{
  color:#ffe578;
}

/* MENU */

#menu{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle,#4b3171,#09070f 80%);
}

.menuBox{
  width:min(520px,95vw);
  padding:30px;
  border-radius:28px;
  background:#211630;
  color:white;
  border:3px solid #8065c8;
  box-shadow:0 20px 70px rgba(0,0,0,.65);
}

.menuBox h1{
  text-align:center;
  font-size:42px;
  margin-bottom:10px;
}

.menuBox p{
  text-align:center;
  opacity:.75;
  line-height:1.4;
  margin-bottom:25px;
}

.menuBox label{
  display:block;
  margin:15px 0 7px;
  font-weight:1000;
}

.menuBox input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:2px solid #654f8d;
  background:#120c1c;
  color:white;
}

#startButton{
  width:100%;
  padding:16px;
  margin-top:22px;
  border:0;
  border-radius:15px;
  background:#7659ee;
  color:white;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
}

/* INTERAÇÃO */

#interact{
  position:fixed;
  z-index:250;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  display:none;
  padding:15px 25px;
  border:3px solid white;
  border-radius:16px;
  background:#30204e;
  color:white;
  font-weight:1000;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 7px 0 rgba(0,0,0,.3);
}

#interact.show{
  display:block;
}

/* DIÁLOGO */

#dialog{
  position:fixed;
  z-index:400;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  width:min(720px,94vw);
  display:none;
  padding:20px;
  border-radius:20px;
  background:rgba(25,16,40,.98);
  color:white;
  border:3px solid #c7aaff;
  box-shadow:0 15px 50px rgba(0,0,0,.6);
}

#dialog.show{
  display:block;
}

#dialogName{
  color:#d9c6ff;
  font-size:21px;
  font-weight:1000;
  margin-bottom:8px;
}

#dialogText{
  font-size:18px;
  line-height:1.45;
  margin-bottom:15px;
}

.dialogButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.dialogButtons button{
  padding:10px 15px;
  border-radius:11px;
  border:2px solid #8064bd;
  background:#3a275a;
  color:white;
  font-weight:1000;
  cursor:pointer;
}

#audioArea{
  margin-top:14px;
  padding:10px;
  background:#100a18;
  border-radius:14px;
  text-align:center;
}

#audioArea iframe{
  width:110px;
  height:200px;
  border:0;
}

/* CHAT */

#chat{
  position:fixed;
  z-index:180;
  right:15px;
  bottom:15px;
  width:300px;
  padding:12px;
  border-radius:17px;
  background:rgba(25,17,40,.94);
  border:2px solid rgba(255,255,255,.25);
  color:white;
}

#chatMessages{
  height:100px;
  overflow:auto;
  font-size:13px;
  margin-bottom:8px;
}

.chatLine{
  margin-bottom:5px;
}

#chatForm{
  display:flex;
  gap:5px;
}

#chatInput{
  min-width:0;
  flex:1;
  border:0;
  border-radius:9px;
  padding:9px;
}

#chatForm button{
  border:0;
  border-radius:9px;
  background:#7355db;
  color:white;
  padding:9px 12px;
  font-weight:1000;
}

/* MOBILE */

#mobileControls{
  position:fixed;
  z-index:190;
  left:15px;
  bottom:15px;
  display:none;
}

.dpad{
  display:grid;
  grid-template-columns:55px 55px 55px;
  grid-template-rows:55px 55px 55px;
  gap:5px;
}

.dpad button{
  border:2px solid white;
  border-radius:12px;
  background:rgba(35,23,54,.88);
  color:white;
  font-size:24px;
}

.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:3}
.right{grid-column:3;grid-row:2}

@media(max-width:700px){
  #mobileControls{
    display:block;
  }

  #chat{
    width:230px;
    bottom:10px;
    right:10px;
  }

  #interact{
    bottom:170px;
  }

  .menuBox h1{
    font-size:31px;
  }
}
</style>
</head>

<script>
/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const worldWidth = 3600;
const worldHeight = 2600;

const player = {
  x:1800,
  y:1500,
  speed:5,
  name:"Player"
};

let running = false;
let nearestNPC = null;
let currentNPC = null;
let portalOpen = false;

const keys = {
  up:false,
  down:false,
  left:false,
  right:false
};

const npcList = [];


/* =========================================================
   ELEMENTOS
========================================================= */

const world =
  document.getElementById("world");

const playerElement =
  document.getElementById("player");

const playerImage =
  document.getElementById("playerImage");

const playerFallback =
  document.getElementById("playerFallback");

const playerName =
  document.getElementById("playerName");

const menu =
  document.getElementById("menu");

const startButton =
  document.getElementById("startButton");

const nameInput =
  document.getElementById("nameInput");

const playerFile =
  document.getElementById("playerFile");

const interact =
  document.getElementById("interact");

const interactName =
  document.getElementById("interactName");

const dialog =
  document.getElementById("dialog");

const dialogName =
  document.getElementById("dialogName");

const dialogText =
  document.getElementById("dialogText");

const closeDialog =
  document.getElementById("closeDialog");

const replayAudio =
  document.getElementById("replayAudio");

const audioArea =
  document.getElementById("audioArea");

const portal =
  document.getElementById("portal");

const portalState =
  document.getElementById("portalState");

const timer =
  document.getElementById("timer");


/* =========================================================
   NPCS
========================================================= */

const npcElements =
  Array.from(document.querySelectorAll(".npc"));

const fallbackEmoji = {
  oliver:"🌳",
  melanie:"🦋",
  burguinho:"🦆",
  rick:"🧪",
  morty:"😰",
  robot:"🤖",
  yume:"🌙",
  jotaro:"⭐"
};

npcElements.forEach((element,index) => {

  const npc = {

    element,

    id:element.dataset.id,

    name:element.dataset.name,

    x:Number(element.dataset.x),

    y:Number(element.dataset.y),

    homeX:Number(element.dataset.x),

    homeY:Number(element.dataset.y),

    range:180,

    dx:0,

    dy:0,

    speed:.7 + Math.random()*.7,

    nextChange:Date.now() + 500 + Math.random()*1000

  };

  element.style.left =
    npc.x + "px";

  element.style.top =
    npc.y + "px";


  /*
    Fallback caso a imagem falhe.
  */

  const image =
    element.querySelector(".npcImage");

  image.addEventListener("error",() => {

    image.style.display = "none";

    if(
      element.querySelector(".npcFallback")
    ) return;

    const fallback =
      document.createElement("div");

    fallback.className =
      "npcFallback";

    fallback.textContent =
      fallbackEmoji[npc.id] || "👤";

    element.appendChild(fallback);

  });


  /*
    Clique direto no NPC.
    Não depende da distância.
  */

  element.addEventListener("click",event => {

    event.stopPropagation();

    openNPC(npc);

  });


  npcList.push(npc);

});

/* =========================================================
   MOVIMENTO DOS NPCS
========================================================= */

function chooseNPCDirection(npc){

  const angle =
    Math.random() * Math.PI * 2;

  npc.speed =
    .6 + Math.random() * .8;

  npc.dx =
    Math.cos(angle) * npc.speed;

  npc.dy =
    Math.sin(angle) * npc.speed;

  npc.nextChange =
    Date.now() +
    1000 +
    Math.random()*2200;

}


/* =========================================================
   ATUALIZA NPC
========================================================= */

function updateNPCs(){

  const now =
    Date.now();

  npcList.forEach(npc => {

    if(now >= npc.nextChange){

      chooseNPCDirection(npc);

    }

    let nextX =
      npc.x + npc.dx;

    let nextY =
      npc.y + npc.dy;


    const minX =
      npc.homeX - npc.range;

    const maxX =
      npc.homeX + npc.range;

    const minY =
      npc.homeY - npc.range;

    const maxY =
      npc.homeY + npc.range;


    if(nextX < minX){

      nextX = minX;

      npc.dx =
        Math.abs(npc.dx);

    }

    if(nextX > maxX){

      nextX = maxX;

      npc.dx =
        -Math.abs(npc.dx);

    }

    if(nextY < minY){

      nextY = minY;

      npc.dy =
        Math.abs(npc.dy);

    }

    if(nextY > maxY){

      nextY = maxY;

      npc.dy =
        -Math.abs(npc.dy);

    }


    npc.x = nextX;
    npc.y = nextY;


    npc.element.style.left =
      npc.x + "px";

    npc.element.style.top =
      npc.y + "px";

  });

}


/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(){

  let dx = 0;
  let dy = 0;

  if(keys.up) dy -= 1;
  if(keys.down) dy += 1;
  if(keys.left) dx -= 1;
  if(keys.right) dx += 1;


  if(dx !== 0 || dy !== 0){

    const length =
      Math.sqrt(dx*dx + dy*dy);

    dx /= length;
    dy /= length;

    player.x +=
      dx * player.speed;

    player.y +=
      dy * player.speed;

  }


  player.x =
    Math.max(
      50,
      Math.min(
        worldWidth-190,
        player.x
      )
    );

  player.y =
    Math.max(
      50,
      Math.min(
        worldHeight-220,
        player.y
      )
    );


  playerElement.style.left =
    player.x + "px";

  playerElement.style.top =
    player.y + "px";

}


/* =========================================================
   DISTÂNCIA
========================================================= */

function distance(a,b){

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx*dx + dy*dy
  );

}


/* =========================================================
   NPC MAIS PRÓXIMO
========================================================= */

function checkNearestNPC(){

  let closest = null;
  let closestDistance = Infinity;


  const playerPoint = {
    x:player.x + 70,
    y:player.y + 90
  };


  npcList.forEach(npc => {

    const npcPoint = {
      x:npc.x + 75,
      y:npc.y + 95
    };


    const d =
      distance(
        playerPoint,
        npcPoint
      );


    if(
      d < closestDistance
    ){

      closestDistance = d;
      closest = npc;

    }

  });


  /*
    A área de interação agora é grande.
    300px no mapa.
  */

  if(
    closest &&
    closestDistance <= 300
  ){

    nearestNPC = closest;

    closest.element
      .classList.add("near");

    interact.classList.add("show");

    interactName.textContent =
      closest.name;

  }else{

    nearestNPC = null;

    npcList.forEach(npc => {
      npc.element
        .classList.remove("near");
    });

    interact.classList.remove("show");

    interactName.textContent = "";

  }

}


/* =========================================================
   ABRIR NPC
========================================================= */

function openNPC(npc){

  currentNPC = npc;

  dialogName.textContent =
    npc.name;

  dialogText.textContent =
    dialogue[npc.id] ||
    "Olá!";


  audioArea.innerHTML = "";

  if(sounds[npc.id]){

    const iframe =
      document.createElement("iframe");

    iframe.src =
      sounds[npc.id];

    iframe.width = "110";
    iframe.height = "200";

    iframe.frameBorder = "0";
    iframe.scrolling = "no";
    iframe.allow = "autoplay";

    audioArea.appendChild(iframe);

  }


  dialog.classList.add("show");

}

});

/* =========================================================
   TECLADO
========================================================= */

window.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ){

      keys.up = true;

    }

    if(
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ){

      keys.down = true;

    }

    if(
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ){

      keys.left = true;

    }

    if(
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ){

      keys.right = true;

    }


    if(
      event.key === "e" ||
      event.key === "E"
    ){

      if(nearestNPC){

        openNPC(nearestNPC);

      }

    }


    if(event.key === "Escape"){

      dialog.classList.remove("show");

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    if(
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ){

      keys.up = false;

    }

    if(
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ){

      keys.down = false;

    }

    if(
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ){

      keys.left = false;

    }

    if(
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ){

      keys.right = false;

    }

  }
);

  );

});

      return;

    }


    const portalPoint = {
      x:1800,
      y:1080
    };


    const playerPoint = {
      x:player.x,
      y:player.y
    };


    if(
      distance(
        playerPoint,
        portalPoint
      ) <= 500
    ){

      dialogName.textContent =
        "🌀 PORTAL DA PROVA";

      dialogText.textContent =
        "O portal está aberto! A próxima prova espera por você.";

      audioArea.innerHTML = "";

      dialog.classList.add("show");

    }else{

      timer.textContent =
        "🌀 Chegue mais perto do portal!";

    }

  }
);


/* =========================================================
   CÂMERA
========================================================= */

function updateCamera(){

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;


  let cameraX =
    player.x -
    screenWidth/2;

  let cameraY =
    player.y -
    screenHeight/2;


  cameraX =
    Math.max(
      0,
      Math.min(
        worldWidth-screenWidth,
        cameraX
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        worldHeight-screenHeight,
        cameraY
      )
    );


  world.style.transform =
    "translate(" +
    (-cameraX) +
    "px," +
    (-cameraY) +
    "px)";

}


/* =========================================================
   CHAT
========================================================= */

document
.getElementById("chatForm")
.addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const input =
      document.getElementById("chatInput");

    const text =
      input.value.trim();


    if(!text) return;


    const message =
      document.createElement("div");

    message.className =
      "chatLine";


    message.textContent =
      player.name +
      ": " +
      text;


    document
      .getElementById("chatMessages")
      .appendChild(message);


    input.value = "";

  }
);


/* =========================================================
   LOOP
========================================================= */

function loop(){

  /*
    NPCs SEMPRE atualizam.
  */

  updateNPCs();


  /*
    Player atualiza se o jogo começou.
  */

  if(running){

    updatePlayer();

    checkNearestNPC();

    updateCamera();

  }


  requestAnimationFrame(loop);

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

npcList.forEach(
  npc => chooseNPCDirection(npc)
);

playerElement.style.left =
  player.x + "px";

playerElement.style.top =
  player.y + "px";

updateCamera();

loop();

</script>
