<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Attorneys</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#17111f;color:#fff}button,input{font:inherit}#menu{height:100%;display:grid;place-items:center;background:#21172f;padding:20px}.menu-box{width:min(450px,100%);padding:30px;border:3px solid #9d72c9;border-radius:22px;background:#30203e;box-shadow:0 15px 50px #0009;text-align:center}.menu-box h1{font-size:clamp(30px,8vw,46px);margin-bottom:8px}.menu-box p{color:#d8cbe1;line-height:1.45;margin-bottom:20px}.menu-box label{display:block;text-align:left;font-weight:bold;margin:12px 0 6px}#playerNameInput{width:100%;padding:13px;border:2px solid #75558e;border-radius:12px;background:#1b1423;color:#fff;outline:none}.file-box{border:2px dashed #80619a;border-radius:14px;padding:14px;background:#21172c}.file-box input{width:100%;color:#ddd}.preview-area{display:none;flex-direction:column;align-items:center;gap:5px;margin-top:12px}.preview-area.show{display:flex}.preview-area img{width:90px;height:90px;object-fit:contain;border-radius:12px;background:#17111f}#fileName{font-size:12px;color:#aaa;max-width:100%;overflow:hidden;text-overflow:ellipsis}#startGame{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:#bd8eea;color:#21152b;font-weight:900;cursor:pointer}#game{position:relative;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none}#world{position:absolute;width:3600px;height:2600px;transform-origin:0 0}#grass{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.18;pointer-events:none}#island{position:absolute;left:140px;top:120px;width:3320px;height:2360px;border-radius:46% 54% 49% 51% / 45% 48% 52% 55%;background:#8fc66b url('https://wallpapercave.com/wp/wp10944792.png') center/cover repeat;border:22px solid #668f4e;box-shadow:inset 0 0 0 8px #b8dc88,inset 0 0 55px #507c3e}.path{position:absolute;background:#c89a60;border:7px solid #a87546;box-shadow:inset 0 0 0 5px #dcb477}.horizontal{height:95px;border-radius:60px}.vertical{width:95px;border-radius:60px}.pond{position:absolute;background:#63b8d2;border:12px solid #397e9a;border-radius:50%;box-shadow:inset 0 0 0 7px #8dd1dd}.flower{position:absolute;width:52px;height:52px;object-fit:contain}.tree{position:absolute;width:150px;height:170px;object-fit:contain}.rock{position:absolute;width:70px;height:48px;border-radius:50%;background:#777;box-shadow:inset -8px -5px #555}.bush{position:absolute;width:110px;height:70px;border-radius:50%;background:#3e7e47;box-shadow:20px -15px #4d914f,45px -5px #397642,inset -10px -10px #285d35}.npc{position:absolute;width:150px;text-align:center;z-index:20;cursor:pointer}.npc img{width:115px;height:130px;object-fit:contain;display:block;margin:auto;filter:drop-shadow(0 8px 4px #0008)}.npc-name{position:absolute;left:50%;bottom:125px;transform:translateX(-50%);padding:6px 10px;border-radius:10px;background:#171322e8;border:2px solid #ffffff45;font-size:14px;font-weight:900;white-space:nowrap;pointer-events:none}.npc.near img{filter:drop-shadow(0 0 12px #f1c7ff) drop-shadow(0 8px 4px #0008)}#playerCharacter{position:absolute;width:105px;height:125px;object-fit:contain;z-index:30;filter:drop-shadow(0 8px 4px #0008)}#playerNameTag{position:absolute;z-index:31;padding:6px 10px;background:#171322ee;border:2px solid #ffffff45;border-radius:10px;font-size:14px;font-weight:900;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%)}#hud{position:absolute;inset:0;z-index:100;pointer-events:none}#top-left,#timer{position:absolute;top:12px;background:#171322e8;border:2px solid #ffffff35;border-radius:12px;padding:10px 14px;font-weight:bold}#top-left{left:12px}#timer{right:12px}#chat{position:absolute;right:12px;top:62px;width:230px;padding:10px;background:#171322dd;border:2px solid #ffffff25;border-radius:13px;pointer-events:auto}#chatLog{height:80px;overflow-y:auto;font-size:12px;margin-bottom:7px}.chat-row{display:flex;gap:5px}#chatInput{min-width:0;flex:1;padding:7px;border-radius:8px;border:1px solid #ffffff25;background:#ffffff10;color:#fff}#chatSend,#interact{border:0;border-radius:10px;cursor:pointer;font-weight:bold}#chatSend{padding:7px}#dialog{position:absolute;left:8%;right:8%;bottom:75px;background:#171322f7;border:2px solid #ffffff35;border-radius:17px;padding:16px;display:none;pointer-events:auto}#dialog.show{display:block}#dialogTitle{font-size:20px;font-weight:bold;margin-bottom:7px}#dialogText{color:#ddd;line-height:1.5;white-space:pre-line}.dialog-buttons{display:flex;gap:8px;margin-top:12px}.dialog-buttons button{padding:9px 13px;border-radius:10px;border:0;cursor:pointer;font-weight:bold}#closeDialog{background:#ffffff18;color:#fff;border:1px solid #ffffff25}#interact{position:absolute;right:15px;bottom:15px;padding:13px 18px;background:#bd8eea;color:#201426;pointer-events:auto;display:none}#mobileControls{position:absolute;left:12px;bottom:12px;display:grid;grid-template-columns:48px 48px 48px;gap:5px;pointer-events:auto}#mobileControls button{width:48px;height:48px;border-radius:11px;border:1px solid #ffffff30;background:#171322cc;color:#fff;font-size:19px;font-weight:bold}#mobileUp{grid-column:2}#mobileLeft{grid-column:1}#mobileDown{grid-column:2}#mobileRight{grid-column:3}@media(max-width:600px){#chat{width:190px}.npc-name{font-size:12px}}
</style>
</head>
<body>
<div id="menu"><div class="menu-box"><h1>THE ATTORNEYS</h1><p>Bem-vindo ao lobby.<br>Explore a ilha enquanto espera a próxima prova.</p><label for="playerNameInput">Seu nome</label><input id="playerNameInput" maxlength="20" placeholder="Digite seu nome"><label for="playerImageInput">Sua imagem/personagem</label><div class="file-box"><input type="file" id="playerImageInput" accept="image/png,image/jpeg,image/webp,image/gif"><div id="previewArea" class="preview-area"><img id="playerPreview"><span id="fileName"></span></div></div><button id="startGame">ENTRAR NO LOBBY</button></div></div>
<div id="game" hidden><div id="world"><img id="grass" src="https://wallpapercave.com/wp/wp10944792.png" alt=""><div id="island"></div><div class="path horizontal" style="left:450px;top:1180px;width:2750px"></div><div class="path vertical" style="left:1740px;top:300px;height:1800px"></div><div class="pond" style="left:420px;top:410px;width:430px;height:300px"></div><div class="pond" style="left:2660px;top:1650px;width:390px;height:300px"></div><div class="bush" style="left:1150px;top:600px"></div><div class="bush" style="left:2300px;top:500px"></div><div class="rock" style="left:1250px;top:1850px"></div><div class="rock" style="left:2850px;top:1250px"></div>
<div class="npc" data-id="burguinho" style="left:560px;top:1060px"><div class="npc-name">Burguinho</div><img src="https://png.pngtree.com/png-vector/20241203/ourmid/pngtree-duck-animal-png-image_14602800.png" alt="Burguinho"></div><div class="npc" data-id="yume" style="left:900px;top:470px"><div class="npc-name">Yume</div><img src="https://static.wikia.nocookie.net/melanie-martinez/images/f/f5/Circle_-_in_-_stop_-_motion.webp/revision/latest/scale-to-width-down/250?cb=20260603173801" alt="Yume"></div><div class="npc" data-id="melanie" style="left:1200px;top:1250px"><div class="npc-name">Melanie Martinez</div><img src="https://i.pinimg.com/736x/a1/26/60/a12660f3c13e52558b47d0fc39963556.jpg" alt="Melanie Martinez"></div><div class="npc" data-id="oliver" style="left:2250px;top:1200px"><div class="npc-name">Oliver Tree</div><img src="https://i.pinimg.com/736x/c7/f3/7f/c7f37f8a6488b8f5fd78eb124e1d5b7d.jpg" alt="Oliver Tree"></div><div class="npc" data-id="rick" style="left:650px;top:1750px"><div class="npc-name">Rick</div><img src="https://pngimg.com/uploads/rick_morty/rick_morty_PNG8.png" alt="Rick"></div><div class="npc" data-id="morty" style="left:850px;top:1850px"><div class="npc-name">Morty</div><img src="https://pngimg.com/uploads/rick_morty/morty_PNG18.png" alt="Morty"></div><div class="npc" data-id="robot" style="left:1900px;top:700px"><div class="npc-name">Robot</div><img src="https://pngimg.com/uploads/robot/robot_PNG96.png" alt="Robot"></div><div class="npc" data-id="jotaro" style="left:2700px;top:1150px"><div class="npc-name">Jotaro</div><img src="https://static.wikia.nocookie.net/shonenheroes/images/4/4b/Jotaro_Kujo.png/revision/latest?cb=20231223053813" alt="Jotaro"></div><div id="playerNameTag"></div><img id="playerCharacter" alt="Seu personagem"></div><div id="hud"><div id="top-left">Jogador</div><div id="timer">Explore a ilha</div><div id="chat"><div id="chatLog">Lobby conectado.</div><div class="chat-row"><input id="chatInput" maxlength="120" placeholder="mensagem..."><button id="chatSend">OK</button></div></div><div id="dialog"><div id="dialogTitle"></div><div id="dialogText"></div><div class="dialog-buttons"><button id="closeDialog">Fechar</button></div></div><div id="mobileControls"><button id="mobileUp" data-key="ArrowUp">▲</button><button id="mobileLeft" data-key="ArrowLeft">◀</button><button id="mobileDown" data-key="ArrowDown">▼</button><button id="mobileRight" data-key="ArrowRight">▶</button></div><button id="interact">INTERAGIR (E)</button></div></div></div>
<script>
const $=id=>document.getElementById(id),menu=$("menu"),game=$("game"),world=$("world"),player=$("playerCharacter"),tag=$("playerNameTag"),dialog=$("dialog"),dialogTitle=$("dialogTitle"),dialogText=$("dialogText"),nearButton=$("interact");let x=1750,y=1250,cameraX=0,cameraY=0,keys=new Set(),playerImage="",running=false;const speed=6;
const texts={burguinho:"QUACK! Bem-vindo ao lobby!",yume:"Oi! Explore o lobby enquanto espera a próxima prova.",melanie:"Abuelita, open the door.",oliver:"ONINONINON!",rick:"Para de ser um idiota, Morty!",morty:"P-porra, Rick! Onde a gente está?",robot:"Posso te informar sobre as provas, regras e participantes.",jotaro:"Yare yare daze..."};
$("playerImageInput").addEventListener("change",e=>{const f=e.target.files[0];if(!f||!f.type.startsWith("image/"))return;const r=new FileReader();r.onload=()=>{playerImage=r.result;$("playerPreview").src=playerImage;$("previewArea").classList.add("show");$("fileName").textContent=f.name};r.readAsDataURL(f)});
$("startGame").onclick=()=>{player.src=playerImage||"data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120"><text x="50" y="75" text-anchor="middle" font-size="65">🧑</text></svg>');const n=$("playerNameInput").value.trim()||"Jogador";tag.textContent=n;$("top-left").textContent=n;menu.style.display="none";game.hidden=false;running=true;requestAnimationFrame(loop)};
function nearest(){let best=null,dist=Infinity;document.querySelectorAll(".npc").forEach(n=>{const d=Math.hypot(x-(parseFloat(n.style.left)+75),y-(parseFloat(n.style.top)+65));if(d<dist){dist=d;best=n}});return dist<=190?best:null}
function interact(){const n=nearest();if(!n){dialog.classList.remove("show");return}dialogTitle.textContent=n.querySelector(".npc-name").textContent;dialogText.textContent=texts[n.dataset.id]||"Olá!";dialog.classList.add("show")}
nearButton.onclick=interact;$("closeDialog").onclick=()=>dialog.classList.remove("show");document.querySelectorAll(".npc").forEach(n=>n.onclick=()=>{const nx=parseFloat(n.style.left)+75,ny=parseFloat(n.style.top)+65;if(Math.hypot(x-nx,y-ny)<=230)interact();else{dialogTitle.textContent="Muito longe";dialogText.textContent="Aproxime-se do personagem para interagir.";dialog.classList.add("show")}});
window.onkeydown=e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;if(e.key.toLowerCase()==="e"){e.preventDefault();interact()}if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d","W","A","S","D"].includes(e.key)){e.preventDefault();keys.add(e.key)}};window.onkeyup=e=>keys.delete(e.key);document.querySelectorAll("#mobileControls button").forEach(b=>{b.onpointerdown=e=>{e.preventDefault();keys.add(b.dataset.key)};b.onpointerup=()=>keys.delete(b.dataset.key);b.onpointerleave=()=>keys.delete(b.dataset.key)});
function move(){let dx=0,dy=0;if(keys.has("ArrowUp")||keys.has("w")||keys.has("W"))dy-=speed;if(keys.has("ArrowDown")||keys.has("s")||keys.has("S"))dy+=speed;if(keys.has("ArrowLeft")||keys.has("a")||keys.has("A"))dx-=speed;if(keys.has("ArrowRight")||keys.has("d")||keys.has("D"))dx+=speed;x=Math.max(180,Math.min(3420,x+dx));y=Math.max(160,Math.min(2440,y+dy))}
function update(){player.style.left=x-52+"px";player.style.top=y-62+"px";tag.style.left=x+"px";tag.style.top=y-68+"px";const n=nearest();document.querySelectorAll(".npc").forEach(a=>a.classList.toggle("near",a===n));nearButton.style.display=n?"block":"none";const w=game.clientWidth,h=game.clientHeight;cameraX=Math.max(0,Math.min(3600-w,x-w/2));cameraY=Math.max(0,Math.min(2600-h,y-h/2));world.style.transform=`translate(${-cameraX}px,${-cameraY}px)`}
function loop(){if(!running)return;move();update();requestAnimationFrame(loop)}
$("chatSend").onclick=()=>{const input=$("chatInput"),v=input.value.trim();if(v){$("chatLog").innerHTML+=`<br><b>Você:</b> ${v.replace(/[<>]/g,"")}`;input.value=""}};
</script></body></html>
