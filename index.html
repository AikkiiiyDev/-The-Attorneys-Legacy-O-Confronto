<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Attorneys</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#181323;
  color:white;
}

button,input{
  font:inherit;
}

#menu{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#21172f;
}

.menu-box{
  width:min(430px,90%);
  padding:30px;
  border:3px solid #9d72c9;
  border-radius:22px;
  background:#30203e;
  box-shadow:0 15px 50px #0008;
  text-align:center;
}

.menu-box h1{
  font-size:42px;
  margin-bottom:8px;
}

.menu-box p{
  color:#d6c9df;
  margin-bottom:22px;
}

.menu-box input{
  width:100%;
  padding:14px;
  border:2px solid #75558e;
  border-radius:12px;
  background:#1b1423;
  color:white;
  outline:none;
  margin-bottom:12px;
}

.menu-box button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#bd8eea;
  color:#201426;
  font-weight:bold;
  cursor:pointer;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
}

#world{
  position:absolute;
  width:3600px;
  height:2600px;
  left:0;
  top:0;
  transform-origin:0 0;
}

/* GRAMA */
#grass{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  image-rendering:auto;
  opacity:.38;
}

/* ILHA */
#island{
  position:absolute;
  left:140px;
  top:120px;
  width:3320px;
  height:2360px;
  border-radius:46% 54% 49% 51% / 45% 48% 52% 55%;
  background:#8fc66b;
  border:22px solid #668f4e;
  box-shadow:
    inset 0 0 0 8px #b8dc88,
    inset 0 0 50px #507c3e;
}

/* CAMINHOS */
.path{
  position:absolute;
  background:#c89a60;
  border:7px solid #a87546;
  box-shadow:inset 0 0 0 5px #dcb477;
}

.path.horizontal{
  height:95px;
  border-radius:60px;
}

.path.vertical{
  width:95px;
  border-radius:60px;
}

/* ÁGUA */
.pond{
  position:absolute;
  background:#63b8d2;
  border:12px solid #397e9a;
  border-radius:50%;
  box-shadow:inset 0 0 0 7px #8dd1dd;
}

/* FLORES */
.flower{
  position:absolute;
  width:52px;
  height:52px;
  object-fit:contain;
  image-rendering:pixelated;
}

/* ÁRVORES */
.tree{
  position:absolute;
  width:150px;
  height:170px;
  object-fit:contain;
}

/* PEDRAS */
.rock{
  position:absolute;
  width:70px;
  height:48px;
  border-radius:50%;
  background:#777;
  box-shadow:inset -8px -5px #555;
}

/* ARBUSTOS */
.bush{
  position:absolute;
  width:110px;
  height:70px;
  border-radius:50%;
  background:#3e7e47;
  box-shadow:
    20px -15px #4d914f,
    45px -5px #397642,
    inset -10px -10px #285d35;
}

/* NPC */
.npc{
  position:absolute;
  width:140px;
  text-align:center;
  z-index:20;
}

.npc img{
  width:110px;
  height:125px;
  object-fit:contain;
  filter:drop-shadow(0 8px 4px #0008);
}

.npc-name{
  display:inline-block;
  margin-top:4px;
  padding:6px 9px;
  border-radius:10px;
  background:#171322e8;
  border:2px solid #ffffff44;
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
}

/* PLAYER */
#player{
  position:absolute;
  width:100px;
  height:120px;
  object-fit:contain;
  z-index:30;
  filter:drop-shadow(0 8px 4px #0008);
}

/* PORTAL */
#portal{
  position:absolute;
  width:180px;
  height:220px;
  border-radius:50% 50% 18% 18%;
  background:
    radial-gradient(
      ellipse,
      white 0%,
      #e1b5ff 12%,
      #914ee8 43%,
      #35165d 70%,
      transparent 72%
    );
  box-shadow:0 0 45px #c889ff;
  z-index:15;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:12px;
  font-weight:bold;
  text-shadow:0 2px 5px black;
  animation:pulse 1.5s infinite;
}

#portal.hidden{
  display:none;
}

@keyframes pulse{
  50%{
    transform:scale(1.07);
  }
}

/* HUD */
#hud{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
}

#top-left{
  position:absolute;
  top:12px;
  left:12px;
  background:#171322e8;
  border:2px solid #ffffff35;
  border-radius:12px;
  padding:10px 14px;
  font-weight:bold;
}

#timer{
  position:absolute;
  top:12px;
  right:12px;
  background:#171322e8;
  border:2px solid #ffffff35;
  border-radius:12px;
  padding:10px 14px;
  font-weight:bold;
}

/* CHAT */
#chat{
  position:absolute;
  right:12px;
  top:62px;
  width:230px;
  padding:10px;
  background:#171322dd;
  border:2px solid #ffffff25;
  border-radius:13px;
  pointer-events:auto;
}

#chatLog{
  height:80px;
  overflow-y:auto;
  font-size:12px;
  margin-bottom:7px;
}

.chat-row{
  display:flex;
  gap:5px;
}

#chatInput{
  min-width:0;
  flex:1;
  padding:7px;
  border-radius:8px;
  border:1px solid #ffffff25;
  background:#ffffff10;
  color:white;
  outline:none;
}

#chatSend{
  border:0;
  border-radius:8px;
  padding:7px;
  cursor:pointer;
}

/* DIÁLOGO */
#dialog{
  position:absolute;
  left:8%;
  right:8%;
  bottom:75px;
  background:#171322f5;
  border:2px solid #ffffff35;
  border-radius:17px;
  padding:16px;
  display:none;
  pointer-events:auto;
}

#dialog.show{
  display:block;
}

#dialogTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:7px;
}

#dialogText{
  color:#ddd;
  line-height:1.5;
}

.dialog-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.dialog-buttons button{
  padding:9px 13px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

#replay{
  background:#bd8eea;
}

#closeDialog{
  background:#ffffff18;
  color:white;
  border:1px solid #ffffff25 !important;
}

/* CONTROLES */
#interact{
  position:absolute;
  right:15px;
  bottom:15px;
  padding:13px 18px;
  border:0;
  border-radius:12px;
  background:#bd8eea;
  color:#201426;
  font-weight:bold;
  pointer-events:auto;
  cursor:pointer;
}

#mobileControls{
  position:absolute;
  left:12px;
  bottom:12px;
  display:grid;
  grid-template-columns:48px 48px 48px;
  gap:5px;
  pointer-events:auto;
}

#mobileControls button{
  width:48px;
  height:48px;
  border-radius:11px;
  border:1px solid #ffffff30;
  background:#171322cc;
  color:white;
  font-size:19px;
}

#mobileUp{
  grid-column:2;
}

#mobileLeft{
  grid-column:1;
}

#mobileDown{
  grid-column:2;
}

#mobileRight{
  grid-column:3;
}

@media(max-width:600px){

  .menu-box h1{
    font-size:32px;
  }

  #chat{
    width:190px;
    top:60px;
  }

  #dialog{
    left:4%;
    right:4%;
  }

}
</style>
</head>

<script>

/* =====================================================
   CONFIGURAÇÃO DOS ASSETS
===================================================== */

const ASSETS = {

  player: "",

  jotaro:
    "https://static.wikia.nocookie.net/shonen-heroes/images/4/4b/Jotaro_Kujo.png/revision/latest?cb=20231223053813",

  flower:
    "https://png.pngtree.com/png-clipart/20231024/ourmid/pngtree-flower-pixel-morada-png-image_10066281.png",

  grass:
    "https://wallpapercave.com/wp/wp10944792.png"

};


/* =====================================================
   ÁUDIOS

   ATENÇÃO:
   os links abaixo são as páginas que você mandou.
   Quando tiver o MP3 direto, é só substituir o link.
===================================================== */

const AUDIO = {

  burguinho: "",

  yume: "",

  melanie:
    "https://www.tiktok.com/@itsdxnmusic/video/7489437949529050375?is_from_webapp=1&sender_device=pc&web_id=7571823244727617031",

  oliver:
    "https://www.tiktok.com/@elhsi.bautista.ba/video/7652230920736361749?is_from_webapp=1&sender_device=pc&web_id=7571823244727617031",

  rick:
    "https://www.myinstants.com/pt/instant/wubalubadubdub/?utm_source=copy&utm_medium=share",

  morty:
    "https://www.myinstants.com/pt/instant/morty-hell-yeah-15685/?utm_source=copy&utm_medium=share",

  robot: "",

  jotaro:
    "https://www.myinstants.com/pt/instant/yare-yare-daze-jotaro-kujo-444/?utm_source=copy&utm_medium=share"

};


/* =====================================================
   FALAS
===================================================== */

const NPC_TEXT = {

  burguinho:
    "QUACK! Bem-vindo ao lobby!",

  yume:
    "Oi! Explore o lobby enquanto espera a próxima prova.",

  melanie:
    "Bem-vindo ao The Attorneys. Boa sorte na prova!",

  oliver:
    "ONINONINON! O portal vai abrir!",

  rick:
    "WUBALUBADUBDUB!",

  morty:
    "Hell yeah!",

  robot:
    "Posso te informar sobre provas, regras, mapa, participantes e calendário.",

  jotaro:
    "Yare yare daze..."

};


/* =====================================================
   ELEMENTOS
===================================================== */

const menu =
  document.getElementById("menu");

const game =
  document.getElementById("game");

const world =
  document.getElementById("world");

const player =
  document.getElementById("player");

const playerName =
  document.getElementById("playerName");

const nameBadge =
  document.getElementById("top-left");

const timer =
  document.getElementById("timer");

const portal =
  document.getElementById("portal");

const dialog =
  document.getElementById("dialog");

const dialogTitle =
  document.getElementById("dialogTitle");

const dialogText =
  document.getElementById("dialogText");


/* =====================================================
   PLAYER
===================================================== */

let x = 1750;
let y = 1250;

let keys =
  new Set();

let lastNpc =
  null;

let lastAudio =
  null;

let portalOpen =
  false;

let endTime =
  0;


/* =====================================================
   PLAYER PADRÃO

   Depois você pode colocar seu PNG aqui.
===================================================== */

player.src =
  ASSETS.player ||
  "data:image/svg+xml;charset=utf-8," +
  encodeURIComponent(`
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="100"
      height="120"
    >
      <text
        x="50"
        y="75"
        text-anchor="middle"
        font-size="65"
      >
        🐱
      </text>
    </svg>
  `);


/* =====================================================
   COMEÇAR
===================================================== */

document
  .getElementById("startGame")
  .addEventListener("click", startGame);


function startGame(){

  menu.style.display =
    "none";

  game.hidden =
    false;

  const name =
    playerName.value.trim();

  nameBadge.textContent =
    name || "Jogador";

  endTime =
    Date.now() + 15000;

  requestAnimationFrame(loop);

}


/* =====================================================
   MOVIMENTO
===================================================== */

window.addEventListener(
  "keydown",
  function(event){

    const allowed = [

      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      "w",
      "a",
      "s",
      "d"

    ];

    if(
      allowed.includes(event.key)
    ){

      event.preventDefault();

      keys.add(event.key);

    }

    if(
      event.key.toLowerCase()
      === "e"
    ){

      interact();

    }

  }
);


window.addEventListener(
  "keyup",
  function(event){

    keys.delete(event.key);

  }
);


/* =====================================================
   BOTÕES MOBILE
===================================================== */

document
  .querySelectorAll(
    "#mobileControls button"
  )
  .forEach(button => {

    button.addEventListener(
      "pointerdown",
      function(){

        keys.add(
          button.dataset.key
        );

      }
    );

    button.addEventListener(
      "pointerup",
      function(){

        keys.delete(
          button.dataset.key
        );

      }
    );

    button.addEventListener(
      "pointerleave",
      function(){

        keys.delete(
          button.dataset.key
        );

      }
    );

  });


/* =====================================================
   NPC MAIS PRÓXIMO
===================================================== */

function nearestNpc(){

  let nearest =
    null;

  let bestDistance =
    Infinity;

  document
    .querySelectorAll(".npc")
    .forEach(npc => {

      const npcX =
        npc.offsetLeft + 70;

      const npcY =
        npc.offsetTop + 65;

      const distance =
        Math.hypot(
          npcX - x,
          npcY - y
        );

      if(
        distance < bestDistance
      ){

        bestDistance =
          distance;

        nearest =
          npc;

      }

    });

  if(
    bestDistance < 190
  ){

    return nearest;

  }

  return null;

}


/* =====================================================
   INTERAÇÃO
===================================================== */

document
  .getElementById("interact")
  .addEventListener(
    "click",
    interact
  );


function interact(){

  const npc =
    nearestNpc();

  if(!npc){

    return;

  }

  lastNpc =
    npc.dataset.id;

  dialogTitle.textContent =
    npc.querySelector(
      ".npc-name"
    ).textContent;

  dialogText.textContent =
    NPC_TEXT[lastNpc] ||
    "Olá!";

  dialog.classList.add(
    "show"
  );

  playNpcAudio(
    lastNpc
  );

}


/* =====================================================
   ÁUDIO
===================================================== */

function playNpcAudio(id){

  if(lastAudio){

    lastAudio.pause();

    lastAudio.currentTime =
      0;

  }

  const src =
    AUDIO[id];

  if(!src){

    return;

  }

  /*
    IMPORTANTE:
    só URLs diretas de arquivos de áudio
    funcionarão aqui.
  */

  lastAudio =
    new Audio(src);

  lastAudio.preload =
    "auto";

  lastAudio.play()
    .catch(() => {

      console.log(
        "Não foi possível reproduzir este link como áudio:",
        src
      );

    });

}


/* =====================================================
   BOTÃO REPETIR
===================================================== */

document
  .getElementById("replay")
  .addEventListener(
    "click",
    function(){

      if(lastNpc){

        playNpcAudio(
          lastNpc
        );

      }

    }
  );

/* =====================================================
   LOOP DO JOGO
===================================================== */

function loop(){

  let dx = 0;
  let dy = 0;


  if(
    keys.has("ArrowLeft") ||
    keys.has("a")
  ){

    dx--;

  }


  if(
    keys.has("ArrowRight") ||
    keys.has("d")
  ){

    dx++;

  }


  if(
    keys.has("ArrowUp") ||
    keys.has("w")
  ){

    dy--;

  }


  if(
    keys.has("ArrowDown") ||
    keys.has("s")
  ){

    dy++;

  }


  if(dx || dy){

    const length =
      Math.hypot(
        dx,
        dy
      );

    x +=
      (dx / length) * 5;

    y +=
      (dy / length) * 5;

  }


  /*
    Limites reais do mundo
  */

  x =
    Math.max(
      180,
      Math.min(
        3420,
        x
      )
    );

  y =
    Math.max(
      150,
      Math.min(
        2450,
        y
      )
    );


  /*
    PLAYER
  */

  player.style.left =
    (x - 50) + "px";

  player.style.top =
    (y - 60) + "px";


  /*
    CÂMERA
  */

  const screenWidth =
    game.clientWidth;

  const screenHeight =
    game.clientHeight;

  const maxCameraX =
    3600 - screenWidth;

  const maxCameraY =
    2600 - screenHeight;


  const cameraX =
    Math.max(
      0,
      Math.min(
        maxCameraX,
        x - screenWidth / 2
      )
    );


  const cameraY =
    Math.max(
      0,
      Math.min(
        maxCameraY,
        y - screenHeight / 2
      )
    );


  world.style.transform =
    "translate(" +
    (-cameraX) +
    "px," +
    (-cameraY) +
    "px)";


  /*
    CONTAGEM DO PORTAL
  */

  if(!portalOpen){

    const seconds =
      Math.max(
        0,
        Math.ceil(
          (endTime - Date.now()) /
          1000
        )
      );

    timer.textContent =
      "PORTAL EM " +
      seconds +
      "s";


    if(seconds <= 0){

      portalOpen =
        true;

      portal.classList.remove(
        "hidden"
      );

      timer.textContent =
        "PORTAL ABERTO!";

    }

  }


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   CHAT
===================================================== */

const chatInput =
  document.getElementById(
    "chatInput"
  );

const chatLog =
  document.getElementById(
    "chatLog"
  );


document
  .getElementById("chatSend")
  .addEventListener(
    "click",
    sendChat
  );


chatInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      sendChat();

    }

  }
);


function sendChat(){

  const message =
    chatInput.value.trim();

  if(!message){

    return;

  }


  const name =
    nameBadge.textContent;


  const line =
    document.createElement(
      "div"
    );

  const bold =
    document.createElement(
      "b"
    );

  bold.textContent =
    name + ": ";

  line.appendChild(
    bold
  );

  line.appendChild(
    document.createTextNode(
      message
    )
  );


  chatLog.appendChild(
    line
  );


  chatLog.scrollTop =
    chatLog.scrollHeight;


  chatInput.value =
    "";

}
