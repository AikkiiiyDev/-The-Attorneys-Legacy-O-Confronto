<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mapa</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#17231a;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
}
<script>
const IMAGENS = {
  // 🌱 CENÁRIO
  grama: "https://imgur.com/a/zXvea9Z",
  grama2: "https://imgur.com/a/VnfpZ3g",

  // 🌸 FLORES
  flor1: "https://imgur.com/a/jXEivgD",
  flor2: "https://imgur.com/a/5ViZBOQ",
  flor3: "https://imgur.com/a/fBh7UKi",

  // 🌳 ÁRVORES
  arvore1: "https://imgur.com/a/mwwbJw4",
  arvore2: "https://imgur.com/a/PWejMRA",

  // 🐾 BICHOS
  gato: "https://imgur.com/a/P5HoaV9",
  cachorro: "https://imgur.com/a/80sd3fV",
  raposa: "https://imgur.com/a/ZuNZMrU",

  urso: "https://imgur.com/a/piQyAwj"

</script>
/* =========================
   MUNDO
========================= */

#world{
  position:absolute;
  width:7000px;
  height:5000px;
  left:0;
  top:0;

  background-color:#70a64e;

  background-image:
    radial-gradient(circle at 15px 12px,rgba(43,91,43,.18) 0 2px,transparent 2.5px),
    radial-gradient(circle at 37px 31px,rgba(255,255,255,.08) 0 1.5px,transparent 2px),
    radial-gradient(circle at 60px 18px,rgba(48,98,43,.13) 0 1px,transparent 2px);

  background-size:75px 65px,90px 80px,110px 95px;

  transition:transform .07s linear;
}

/* =========================
   CAMINHOS
========================= */

.path{
  position:absolute;
  background:#c79a62;
  border:6px solid #ae7e4b;
  box-shadow:
    inset 0 5px rgba(255,255,255,.08),
    inset 0 -5px rgba(75,49,28,.08);
  border-radius:100px;
}

.path::after{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:100px;
  background:
    radial-gradient(circle,#987047 0 2px,transparent 3px);
  background-size:45px 35px;
  opacity:.35;
}

/* =========================
<script>
const IMAGENS = {
  // 🌱 CENÁRIO
  grama: "https://imgur.com/a/zXvea9Z",
  grama2: "https://imgur.com/a/VnfpZ3g",

  // 🌸 FLORES
  flor1: "https://imgur.com/a/jXEivgD",
  flor2: "https://imgur.com/a/5ViZBOQ",
  flor3: "https://imgur.com/a/fBh7UKi",

  // 🌳 ÁRVORES
  arvore1: "https://imgur.com/a/mwwbJw4",

  // 🐾 BICHOS
  gato: "https://imgur.com/a/P5HoaV9",
  cachorro: "https://imgur.com/a/80sd3fV",
  raposa: "https://imgur.com/a/ZuNZMrU",

};

</script>
 
/* =========================
   PLAYER
========================= */

#player{
  position:absolute;
  width:58px;
  height:58px;
  z-index:100;
}

.body{
  position:absolute;
  width:46px;
  height:44px;
  left:6px;
  top:13px;
  border-radius:45% 45% 40% 40%;
  background:#e7b48b;
  border:4px solid #fff;
  box-shadow:0 5px 8px rgba(0,0,0,.2);
}

.ear{
  position:absolute;
  width:20px;
  height:24px;
  top:3px;
  background:#e7b48b;
  border:4px solid white;
  border-radius:9px 9px 3px 3px;
}

.ear.left{
  left:7px;
  transform:rotate(-20deg);
}

.ear.right{
  right:7px;
  transform:rotate(20deg);
}

.eye{
  position:absolute;
  width:5px;
  height:7px;
  background:#252525;
  border-radius:50%;
  top:28px;
}

.eye.one{left:18px}
.eye.two{right:18px}

.nose{
  position:absolute;
  width:8px;
  height:6px;
  background:#533b35;
  border-radius:50%;
  left:23px;
  top:36px;
}

/* =========================
   HUD
========================= */

#hint{
  position:absolute;
  left:15px;
  top:15px;
  z-index:500;
  color:white;
  background:rgba(24,39,27,.82);
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
}

#toast{
  position:absolute;
  z-index:600;
  left:50%;
  bottom:110px;
  transform:translateX(-50%);
  padding:11px 17px;
  background:rgba(25,35,26,.9);
  color:white;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
}

/* =========================
   MINIMAPA
========================= */

#mini{
  position:absolute;
  right:15px;
  top:15px;
  z-index:500;
  width:150px;
  height:105px;
  background:rgba(25,50,29,.8);
  border:3px solid rgba(255,255,255,.55);
  border-radius:13px;
}

/* =========================
   JOYSTICK
========================= */

#joystick{
  position:absolute;
  z-index:700;
  right:20px;
  bottom:20px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:3px solid rgba(255,255,255,.35);
  touch-action:none;
}

#knob{
  position:absolute;
  width:58px;
  height:58px;
  left:33px;
  top:33px;
  border-radius:50%;
  background:rgba(38,62,41,.78);
  border:3px solid rgba(255,255,255,.7);
}

@media(max-width:600px){

  #hint{
    font-size:12px;
    padding:8px 10px;
  }

  #mini{
    width:115px;
    height:82px;
  }

  #joystick{
    width:125px;
    height:125px;
  }

  #knob{
    width:55px;
    height:55px;
    left:32px;
    top:32px;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="world">

    <!-- ÁREAS -->
    <div class="zone" style="left:500px;top:450px;width:1400px;height:850px"></div>
    <div class="zoneTitle" style="left:1050px;top:540px">PRAÇA</div>

    <div class="zone" style="left:3900px;top:700px;width:1600px;height:1300px"></div>
    <div class="zoneTitle" style="left:4450px;top:790px">FLORESTA</div>

    <div class="zone" style="left:900px;top:3400px;width:1500px;height:850px"></div>
    <div class="zoneTitle" style="left:1500px;top:3500px">JARDIM</div>

    <!-- CAMINHOS -->
    <div class="path"
         style="left:250px;top:1500px;width:6100px;height:120px;transform:rotate(-4deg)">
    </div>

    <div class="path"
         style="left:2800px;top:250px;width:120px;height:4300px;transform:rotate(3deg)">
    </div>

    <!-- LAGO -->
    <div class="water"
         style="left:1700px;top:300px;width:1200px;height:720px">
    </div>

    <!-- GRAMA PATCHES -->
    <div class="grassPatch" style="left:300px;top:400px;width:800px;height:400px"></div>
    <div class="grassPatch" style="left:3100px;top:600px;width:700px;height:500px"></div>
    <div class="grassPatch" style="left:500px;top:3000px;width:1000px;height:500px"></div>

    <div id="objects"></div>

    <!-- PLAYER -->
    <div id="player">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="body">
        <div class="eye one"></div>
        <div class="eye two"></div>
        <div class="nose"></div>
      </div>
    </div>

  </div>

  <div id="hint">
    Explore o mapa e toque nas flores e árvores!
  </div>

  <canvas id="mini" width="150" height="105"></canvas>

  <div id="toast"></div>

  <div id="joystick">
    <div id="knob"></div>
  </div>

</div>

<script>

const world = document.getElementById("world");
const player = document.getElementById("player");
const objects = document.getElementById("objects");

const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");

const toast = document.getElementById("toast");

const mini = document.getElementById("mini");
const ctx = mini.getContext("2d");

const WORLD_W = 7000;
const WORLD_H = 5000;

let playerX = 3400;
let playerY = 2500;

let keys = {};

let joyX = 0;
let joyY = 0;
let touchingJoystick = false;


/* =========================
   FLORES
========================= */

const flowerColors = [
  "#f2d34f",
  "#e87591",
  "#c982d6",
  "#f3a85f",
  "#fff4df"
];

for(let i=0;i<180;i++){

  const flower = document.createElement("div");

  flower.className = "flower";

  const color =
    flowerColors[
      Math.floor(Math.random()*flowerColors.length)
    ];

  flower.innerHTML = `
    <div class="stem"></div>
    <div class="petal p1" style="background:${color}"></div>
    <div class="petal p2" style="background:${color}"></div>
    <div class="petal p3" style="background:${color}"></div>
    <div class="petal p4" style="background:${color}"></div>
    <div class="center"></div>
  `;

  flower.style.left =
    (100 + Math.random()*6700) + "px";

  flower.style.top =
    (100 + Math.random()*4700) + "px";

  flower.onclick = () => {

    flower.style.transform =
      "scale(1.5) rotate(12deg)";

    showToast("Você encontrou uma flor! 🌸");

    setTimeout(()=>{
      flower.style.transform = "";
    },300);
  };

  objects.appendChild(flower);
}


/* =========================
   ÁRVORES
========================= */

for(let i=0;i<120;i++){

  const tree = document.createElement("div");

  tree.className = "tree";

  tree.innerHTML = `
    <div class="leaf a"></div>
    <div class="leaf b"></div>
    <div class="leaf c"></div>
    <div class="leaf d"></div>
    <div class="leaf e"></div>
    <div class="trunk"></div>
  `;

  tree.style.left =
    (100 + Math.random()*6700) + "px";

  tree.style.top =
    (100 + Math.random()*4700) + "px";

  tree.onclick = () => {

    tree.animate(
      [
        {transform:"rotate(0deg)"},
        {transform:"rotate(-4deg)"},
        {transform:"rotate(4deg)"},
        {transform:"rotate(0deg)"}
      ],
      {
        duration:350
      }
    );

    showToast("A árvore balançou!");
  };

  objects.appendChild(tree);
}


/* =========================
   PEDRAS
========================= */

for(let i=0;i<70;i++){

  const rock = document.createElement("div");

  rock.className = "rock";

  rock.style.left =
    (100 + Math.random()*6700) + "px";

  rock.style.top =
    (100 + Math.random()*4700) + "px";

  objects.appendChild(rock);
}


/* =========================
   ARBUSTOS
========================= */

for(let i=0;i<80;i++){

  const bush = document.createElement("div");

  bush.className = "bush";

  bush.innerHTML = `
    <span></span>
    <span></span>
    <span></span>
  `;

  bush.style.left =
    (100 + Math.random()*6700) + "px";

  bush.style.top =
    (100 + Math.random()*4700) + "px";

  objects.appendChild(bush);
}


/* =========================
   MOVIMENTO
========================= */

window.addEventListener("keydown",(e)=>{
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",(e)=>{
  keys[e.key.toLowerCase()] = false;
});


function move(dx,dy){

  const speed = 7;

  const length =
    Math.sqrt(dx*dx + dy*dy);

  if(length > 0){

    dx /= length;
    dy /= length;

  }

  playerX += dx * speed;
  playerY += dy * speed;

  playerX =
    Math.max(30,Math.min(WORLD_W-80,playerX));

  playerY =
    Math.max(30,Math.min(WORLD_H-80,playerY));
}


/* =========================
   CÂMERA
========================= */

function render(){

  player.style.left =
    playerX + "px";

  player.style.top =
    playerY + "px";

  const screenW =
    window.innerWidth;

  const screenH =
    window.innerHeight;

  let cameraX =
    playerX - screenW/2;

  let cameraY =
    playerY - screenH/2;

  cameraX =
    Math.max(
      0,
      Math.min(
        WORLD_W-screenW,
        cameraX
      )
    );

  cameraY =
    Math.max(
      0,
      Math.min(
        WORLD_H-screenH,
        cameraY
      )
    );

  world.style.transform =
    `translate(${-cameraX}px,${-cameraY}px)`;


  /* MINIMAPA */

  ctx.clearRect(
    0,
    0,
    mini.width,
    mini.height
  );

  ctx.fillStyle =
    "#70a64e";

  ctx.fillRect(
    0,
    0,
    mini.width,
    mini.height
  );

  ctx.fillStyle =
    "#55a6bd";

  ctx.beginPath();

  ctx.ellipse(
    52,
    17,
    25,
    14,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    (playerX/WORLD_W)*mini.width,
    (playerY/WORLD_H)*mini.height,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();
}


/* =========================
   TOAST
========================= */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },1100);
}


/* =========================
   JOYSTICK
========================= */

function updateJoystick(e){

  const rect =
    joystick.getBoundingClientRect();

  let x =
    e.clientX -
    rect.left -
    rect.width/2;

  let y =
    e.clientY -
    rect.top -
    rect.height/2;

  const max =
    rect.width/2 - 28;

  const distance =
    Math.sqrt(x*x+y*y);

  if(distance > max){

    x =
      x/distance*max;

    y =
      y/distance*max;
  }

  joyX = x/max;
  joyY = y/max;

  knob.style.transform =
    `translate(${x}px,${y}px)`;
}


joystick.addEventListener(
  "pointerdown",
  (e)=>{

    touchingJoystick = true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(e);
  }
);


joystick.addEventListener(
  "pointermove",
  (e)=>{

    if(touchingJoystick){

      updateJoystick(e);

    }
  }
);


function stopJoystick(){

  touchingJoystick = false;

  joyX = 0;
  joyY = 0;

  knob.style.transform =
    "translate(0,0)";
}


joystick.addEventListener(
  "pointerup",
  stopJoystick
);

joystick.addEventListener(
  "pointercancel",
  stopJoystick
);


/* =========================
   LOOP
========================= */

function gameLoop(){

  let dx = joyX;
  let dy = joyY;

  if(keys["w"] || keys["arrowup"])
    dy -= 1;

  if(keys["s"] || keys["arrowdown"])
    dy += 1;

  if(keys["a"] || keys["arrowleft"])
    dx -= 1;

  if(keys["d"] || keys["arrowright"])
    dx += 1;

  if(dx || dy)
    move(dx,dy);

  render();

  requestAnimationFrame(gameLoop);
}


window.addEventListener(
  "resize",
  render
);

render();

gameLoop();

</script>

</body>
</html>
