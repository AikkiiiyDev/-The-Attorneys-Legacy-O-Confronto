<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥 The Attorneys Legacy: O Confronto</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #18251c;
}

/* =========================
   JOGO
========================= */

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #8bcf68;
}

/* Câmera */
#world {
    position: absolute;
    width: 5000px;
    height: 3600px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* =========================
   TERRENO
========================= */

.ground {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.10) 0 3px, transparent 4px),
        radial-gradient(circle at 70% 60%, rgba(0,0,0,.06) 0 3px, transparent 4px),
        #78bd5c;
    background-size: 110px 110px, 150px 150px, auto;
}

/* =========================
   CAMINHOS
========================= */

.path {
    position: absolute;
    background: #d8bd8c;
    border: 5px solid rgba(130,98,60,.25);
    box-shadow: inset 0 0 20px rgba(80,50,20,.12);
}

.path.main-horizontal {
    left: 0;
    top: 1740px;
    width: 5000px;
    height: 220px;
}

.path.main-vertical {
    left: 2390px;
    top: 0;
    width: 220px;
    height: 3600px;
}

.path.northwest {
    left: 650px;
    top: 850px;
    width: 180px;
    height: 1050px;
    transform: rotate(-35deg);
    transform-origin: bottom;
}

.path.southeast {
    left: 3350px;
    top: 1900px;
    width: 180px;
    height: 1050px;
    transform: rotate(-35deg);
    transform-origin: top;
}

.path.beach {
    left: 3550px;
    top: 2850px;
    width: 900px;
    height: 160px;
    transform: rotate(-12deg);
}

/* Pedrinhas */
.path::after {
    content: "";
    position: absolute;
    inset: 20px;
    background-image:
        radial-gradient(circle, rgba(90,70,45,.20) 0 3px, transparent 4px);
    background-size: 55px 45px;
}

/* =========================
   ÁGUA
========================= */

.lake {
    position: absolute;
    width: 950px;
    height: 620px;
    left: 850px;
    top: 420px;
    border-radius: 48% 52% 45% 55%;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.08) 0 8px,
            transparent 8px 20px
        ),
        #55bddd;
    border: 16px solid #d0c18d;
    box-shadow: 0 20px 35px rgba(30,80,70,.25);
}

.lake::before,
.lake::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
}

.lake::before {
    width: 100px;
    height: 12px;
    left: 180px;
    top: 170px;
}

.lake::after {
    width: 150px;
    height: 12px;
    right: 170px;
    top: 330px;
}

/* Ilha */
.island {
    position: absolute;
    width: 230px;
    height: 150px;
    left: 360px;
    top: 220px;
    border-radius: 50%;
    background: #79c75f;
    border: 10px solid #d0c18d;
}

/* Ponte */
.bridge {
    position: absolute;
    width: 330px;
    height: 120px;
    left: 1180px;
    top: 650px;
    background:
        repeating-linear-gradient(
            90deg,
            #9a633e 0 28px,
            #74462e 28px 34px
        );
    border: 8px solid #603b29;
    border-radius: 20px;
    transform: rotate(8deg);
    box-shadow: 0 12px 20px rgba(0,0,0,.18);
}

/* =========================
   DECORAÇÃO
========================= */

.tree {
    position: absolute;
    width: 100px;
    height: 120px;
}

.tree .trunk {
    position: absolute;
    width: 28px;
    height: 65px;
    left: 36px;
    bottom: 0;
    background: #765035;
    border-radius: 10px;
}

.tree .leaf1,
.tree .leaf2,
.tree .leaf3 {
    position: absolute;
    border-radius: 50%;
    background: #3d914b;
    box-shadow: inset -8px -10px 0 rgba(0,0,0,.08);
}

.tree .leaf1 {
    width: 70px;
    height: 70px;
    left: 15px;
    top: 20px;
}

.tree .leaf2 {
    width: 65px;
    height: 65px;
    left: 0;
    top: 45px;
}

.tree .leaf3 {
    width: 65px;
    height: 65px;
    right: 0;
    top: 45px;
}

.tree.big {
    transform: scale(1.5);
}

.flower {
    position: absolute;
    width: 25px;
    height: 25px;
}

.flower::before {
    content: "✿";
    color: #ff77a8;
    font-size: 28px;
}

.flower.yellow::before {
    color: #ffd34e;
}

.flower.white::before {
    color: #fff;
}

/* =========================
   CASAS
========================= */

.house {
    position: absolute;
    width: 280px;
    height: 220px;
    background: #f2d7a5;
    border: 8px solid #8c6845;
    border-radius: 12px;
    box-shadow: 0 18px 25px rgba(0,0,0,.18);
}

.house .roof {
    position: absolute;
    width: 310px;
    height: 120px;
    left: -23px;
    top: -85px;
    background: #b85e4e;
    border: 8px solid #794235;
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
}

.house .door {
    position: absolute;
    width: 55px;
    height: 100px;
    bottom: 0;
    left: 110px;
    background: #71452f;
    border-radius: 10px 10px 0 0;
}

.house .window {
    position: absolute;
    width: 55px;
    height: 55px;
    top: 60px;
    background: #8bd7e7;
    border: 7px solid #694a37;
}

.house .window.left {
    left: 35px;
}

.house .window.right {
    right: 35px;
}

/* =========================
   ÁREAS
========================= */

.area {
    position: absolute;
    border-radius: 35px;
}

.area-label {
    position: absolute;
    top: -65px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    background: rgba(30,40,30,.78);
    color: white;
    border-radius: 30px;
    font-size: 24px;
    font-weight: bold;
    white-space: nowrap;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

/* Praça */
.plaza {
    left: 1750px;
    top: 1350px;
    width: 1300px;
    height: 750px;
    background: #d7c39b;
    border: 16px solid #b09a70;
    box-shadow: inset 0 0 50px rgba(80,50,20,.12);
}

/* Fonte */
.fountain {
    position: absolute;
    width: 250px;
    height: 250px;
    left: 525px;
    top: 245px;
    border-radius: 50%;
    background: #64bdd0;
    border: 25px solid #b5b1a0;
    box-shadow: inset 0 0 20px rgba(0,0,0,.18);
}

.fountain::before {
    content: "💧";
    position: absolute;
    font-size: 70px;
    left: 65px;
    top: 55px;
}

/* Arena */
.arena {
    left: 1980px;
    top: 2300px;
    width: 1100px;
    height: 700px;
    background: #594f65;
    border: 22px solid #312b3a;
    border-radius: 50px;
    box-shadow: 0 30px 45px rgba(0,0,0,.25);
}

.arena .center {
    position: absolute;
    width: 420px;
    height: 250px;
    left: 320px;
    top: 220px;
    border-radius: 50%;
    background: #e2c65f;
    border: 15px solid #f0df91;
}

.arena .banner {
    position: absolute;
    left: 50%;
    top: 50px;
    transform: translateX(-50%);
    color: white;
    font-size: 44px;
    font-weight: 900;
}

/* Floresta */
.forest {
    left: 50px;
    top: 250px;
    width: 800px;
    height: 1250px;
    background: rgba(56,137,66,.20);
    border-radius: 50%;
}

/* Jardim */
.garden {
    left: 3150px;
    top: 550px;
    width: 800px;
    height: 650px;
    background: #9ed66b;
    border: 15px solid #6eaa54;
}

/* Parque */
.park {
    left: 3350px;
    top: 1250px;
    width: 1000px;
    height: 600px;
    background: #8fcf6b;
    border: 15px dashed #599b53;
}

.park::before {
    content: "🎡";
    position: absolute;
    font-size: 190px;
    left: 100px;
    top: 170px;
}

.park::after {
    content: "🎢";
    position: absolute;
    font-size: 190px;
    right: 100px;
    top: 170px;
}

/* Praia */
.beach-zone {
    left: 3600px;
    top: 2850px;
    width: 1250px;
    height: 600px;
    background:
        radial-gradient(circle, rgba(200,170,80,.25) 0 3px, transparent 4px),
        #f1d68c;
    background-size: 45px 45px;
    border-radius: 100px 0 0 0;
}

/* Montanha */
.mountain {
    position: absolute;
    left: 3750px;
    top: 150px;
    width: 950px;
    height: 700px;
    background: #718b70;
    clip-path: polygon(
        0 100%,
        20% 55%,
        35% 70%,
        55% 15%,
        70% 60%,
        85% 35%,
        100% 100%
    );
    opacity: .9;
}

.mountain::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.12);
    clip-path: polygon(55% 15%, 45% 45%, 58% 38%, 70% 60%);
}

/* Área abandonada */
.abandoned {
    left: 300px;
    top: 2600px;
    width: 900px;
    height: 650px;
    background: #59645b;
    border: 18px solid #424b45;
    border-radius: 25px;
}

.abandoned::before {
    content: "⚠";
    position: absolute;
    font-size: 120px;
    left: 380px;
    top: 220px;
    color: #e5c447;
}

/* Caverna */
.cave {
    left: 900px;
    top: 2900px;
    width: 650px;
    height: 500px;
    background: #343a39;
    border-radius: 50% 50% 10% 10%;
    border: 20px solid #4c5550;
}

.cave::before {
    content: "🕳️";
    position: absolute;
    font-size: 180px;
    left: 210px;
    top: 140px;
}

/* Mercado */
.market {
    position: absolute;
    left: 3350px;
    top: 2050px;
    width: 500px;
    height: 350px;
    background: #f3d17d;
    border: 12px solid #9c683c;
    border-radius: 20px;
}

.market::before {
    content: "🛍️ MERCADO";
    position: absolute;
    font-size: 34px;
    font-weight: bold;
    top: 135px;
    left: 80px;
}

/* =========================
   JOGADOR
========================= */

#player {
    position: absolute;
    width: 72px;
    height: 72px;
    z-index: 100;
    transform: translate(-50%, -50%);
    transition: transform .08s linear;
}

.player-body {
    width: 58px;
    height: 58px;
    position: absolute;
    left: 7px;
    top: 7px;
    background: #f3b27c;
    border: 5px solid #633f31;
    border-radius: 45% 45% 50% 50%;
    box-shadow: 0 8px 12px rgba(0,0,0,.25);
}

.player-body::before {
    content: "🐾";
    position: absolute;
    font-size: 30px;
    left: 10px;
    top: 8px;
}

.player-shadow {
    position: absolute;
    width: 65px;
    height: 20px;
    bottom: -5px;
    left: 3px;
    background: rgba(0,0,0,.2);
    border-radius: 50%;
    z-index: -1;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    left: 22px;
    top: 22px;
    z-index: 500;
    padding: 14px 20px;
    background: rgba(25,35,27,.82);
    color: white;
    border-radius: 18px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
}

#hud strong {
    font-size: 20px;
}

#hud small {
    display: block;
    margin-top: 5px;
    opacity: .75;
}

/* minimapa */
#minimap {
    position: fixed;
    right: 22px;
    top: 22px;
    width: 190px;
    height: 135px;
    z-index: 500;
    background: #78bd5c;
    border: 5px solid white;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,.25);
    overflow: hidden;
}

#miniPlayer {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: red;
    transform: translate(-50%, -50%);
}

/* dica */
#controls {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    padding: 12px 22px;
    background: rgba(25,35,27,.82);
    color: white;
    border-radius: 18px;
    backdrop-filter: blur(8px);
}

/* =========================
   TÍTULOS DO MAPA
========================= */

.map-title {
    position: absolute;
    z-index: 20;
    font-size: 42px;
    font-weight: 900;
    color: rgba(35,55,35,.72);
    text-shadow: 2px 3px rgba(255,255,255,.25);
    pointer-events: none;
}

/* =========================
   RESPONSIVO
========================= */

@media (max-width: 700px) {
    #minimap {
        display: none;
    }

    #controls {
        font-size: 13px;
        padding: 10px 15px;
    }
}
</style>
</head>

<body>

    <div id="miniPlayer"></div>

<!-- CONTROLES -->
<div id="controls">
    ⌨️ WASD ou setas para andar
</div>

<script>
const world = document.getElementById("world");
const player = document.getElementById("player");
const miniPlayer = document.getElementById("miniPlayer");

const WORLD_WIDTH = 5000;
const WORLD_HEIGHT = 3600;

let playerX = 2500;
let playerY = 1750;

const speed = 8;
const keys = {};

document.addEventListener("keydown", (event) => {
    keys[event.key.toLowerCase()] = true;

    // evita a página tentar rolar
    if (
        ["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"]
        .includes(event.key.toLowerCase())
    ) {
        event.preventDefault();
    }
});

document.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
});

function updatePlayer() {

    let moving = false;

    if (keys["w"] || keys["arrowup"]) {
        playerY -= speed;
        moving = true;
    }

    if (keys["s"] || keys["arrowdown"]) {
        playerY += speed;
        moving = true;
    }

    if (keys["a"] || keys["arrowleft"]) {
        playerX -= speed;
        moving = true;
    }

    if (keys["d"] || keys["arrowright"]) {
        playerX += speed;
        moving = true;
    }

    // Limites do mapa
    playerX = Math.max(45, Math.min(WORLD_WIDTH - 45, playerX));
    playerY = Math.max(45, Math.min(WORLD_HEIGHT - 45, playerY));

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";

    // Pequena animação andando
    if (moving) {
        const bob = Math.sin(Date.now() / 70) * 3;
        player.style.transform =
            `translate(-50%, -50%) translateY(${bob}px)`;
    } else {
        player.style.transform =
            "translate(-50%, -50%)";
    }

    updateCamera();
    updateMinimap();

    requestAnimationFrame(updatePlayer);
}

function updateCamera() {

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    let cameraX = screenWidth / 2 - playerX;
    let cameraY = screenHeight / 2 - playerY;

    // Não deixa a câmera sair do mapa
    const minX = screenWidth - WORLD_WIDTH;
    const maxX = 0;

    const minY = screenHeight - WORLD_HEIGHT;
    const maxY = 0;

    cameraX = Math.max(minX, Math.min(maxX, cameraX));
    cameraY = Math.max(minY, Math.min(maxY, cameraY));

    world.style.transform =
        `translate(${cameraX}px, ${cameraY}px)`;
}

function updateMinimap() {

    const mapWidth = 190;
    const mapHeight = 135;

    const x = (playerX / WORLD_WIDTH) * mapWidth;
    const y = (playerY / WORLD_HEIGHT) * mapHeight;

    miniPlayer.style.left = x + "px";
    miniPlayer.style.top = y + "px";
}

window.addEventListener("resize", updateCamera);

updatePlayer();
</script>
