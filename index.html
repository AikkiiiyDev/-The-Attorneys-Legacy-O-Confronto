<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Attorneys</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,Helvetica,sans-serif;
  user-select:none;
}

button,input{
  font-family:inherit;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#171126;
}

#camera{
  position:absolute;
  width:100%;
  height:100%;
  overflow:hidden;
}

#world{
  position:absolute;
  width:3600px;
  height:2600px;
  left:0;
  top:0;
  transform-origin:top left;
}

#grass{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

.groundShade{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.08),transparent 22%),
    radial-gradient(circle at 70% 65%,rgba(0,0,0,.08),transparent 28%),
    rgba(65,125,54,.12);
  z-index:1;
  pointer-events:none;
}

.path{
  position:absolute;
  background:#d5b77a;
  border:7px solid rgba(104,77,44,.35);
  border-radius:100px;
  z-index:2;
  box-shadow:
    inset 0 0 0 5px rgba(255,241,184,.25),
    0 8px 0 rgba(53,61,35,.16);
}

.path.main{
  width:2800px;
  height:230px;
  left:400px;
  top:1080px;
  transform:rotate(-2deg);
}

.path.cross{
  width:230px;
  height:1900px;
  left:1690px;
  top:350px;
}

.pond{
  position:absolute;
  width:500px;
  height:330px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#9eeaff,transparent 18%),
    linear-gradient(#36b7df,#187ab4);
  border:14px solid #e8d28c;
  z-index:2;
  box-shadow:
    0 12px 0 rgba(36,70,38,.22),
    inset 0 0 30px rgba(0,0,0,.15);
}

.pond.one{
  left:420px;
  top:330px;
}

.pond.two{
  right:360px;
  bottom:350px;
  width:600px;
  height:360px;
}

.tree{
  position:absolute;
  width:120px;
  height:150px;
  z-index:4;
  pointer-events:none;
}

.tree:before{
  content:"";
  position:absolute;
  width:82px;
  height:82px;
  border-radius:50%;
  background:#397b38;
  left:19px;
  top:0;
  box-shadow:
    30px 15px 0 #4c8e3f,
    -20px 22px 0 #326c35;
}

.tree:after{
  content:"";
  position:absolute;
  width:30px;
  height:70px;
  background:#744d2b;
  left:45px;
  top:72px;
  border-radius:8px;
}

.flower{
  position:absolute;
  font-size:42px;
  z-index:3;
  pointer-events:none;
}

.rock{
  position:absolute;
  width:75px;
  height:42px;
  border-radius:55% 45% 45% 55%;
  background:#6f7066;
  border:5px solid #55574e;
  z-index:3;
}

.flag{
  position:absolute;
  width:100px;
  height:120px;
  z-index:4;
}

.flag:before{
  content:"";
  position:absolute;
  left:10px;
  top:0;
  width:8px;
  height:120px;
  background:#543927;
}

.flag:after{
  content:"THE ATTORNEYS";
  position:absolute;
  left:18px;
  top:12px;
  width:75px;
  height:45px;
  background:#ffdb58;
  color:#37250f;
  font-size:10px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border:4px solid #5d4021;
}

/* PORTAL */

#portal{
  position:absolute;
  left:1660px;
  top:920px;
  width:280px;
  height:400px;
  z-index:8;
  pointer-events:none;
}

.portalRing{
  position:absolute;
  left:20px;
  top:20px;
  width:240px;
  height:360px;
  border:18px solid #5b4de4;
  border-radius:50%;
  background:
    radial-gradient(ellipse,#d8b6ff 0%,#7659ff 35%,#27145d 70%,#08051b 100%);
  box-shadow:
    0 0 30px #735cff,
    0 0 70px rgba(106,74,255,.8),
    inset 0 0 35px #13082e;
  transform:scale(.35);
  opacity:.35;
  transition:1.2s;
}

.portalCore{
  position:absolute;
  left:62px;
  top:62px;
  width:156px;
  height:316px;
  border-radius:50%;
  background:radial-gradient(ellipse,#fff,#cda8ff 10%,#6546ef 30%,#160b42 70%);
  opacity:0;
  transition:1.2s;
}

.portalText{
  position:absolute;
  top:-55px;
  width:100%;
  text-align:center;
  font-size:22px;
  font-weight:1000;
  color:white;
  text-shadow:0 3px 0 #25174d;
  opacity:0;
  transition:.6s;
}

.portal-open .portalRing{
  transform:scale(1);
  opacity:1;
  animation:portalPulse 1.5s infinite alternate;
}

.portal-open .portalCore{
  opacity:1;
  animation:portalCore 1s infinite alternate;
}

.portal-open .portalText{
  opacity:1;
}

.portal-closed .portalRing{
  transform:scale(.35);
  opacity:.35;
}

@keyframes portalPulse{
  from{filter:hue-rotate(0deg);transform:scale(1)}
  to{filter:hue-rotate(35deg);transform:scale(1.07)}
}

@keyframes portalCore{
  from{transform:scale(.96)}
  to{transform:scale(1.05)}
}

/* NPC */

.npc{
  position:absolute;
  width:150px;
  height:190px;
  z-index:20;
  transition:none;
  cursor:pointer;
  pointer-events:auto;
}

.npc img{
  position:absolute;
  left:15px;
  bottom:25px;
  width:120px;
  height:125px;
  object-fit:contain;
  filter:drop-shadow(0 7px 3px rgba(0,0,0,.28));
  pointer-events:none;
}

.npcName{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:-8px;
  white-space:nowrap;
  padding:7px 12px;
  background:rgba(20,14,35,.9);
  color:white;
  border:2px solid rgba(255,255,255,.8);
  border-radius:12px;
  font-size:14px;
  font-weight:900;
  box-shadow:0 4px 0 rgba(0,0,0,.25);
  pointer-events:none;
}

.npc:hover img{
  transform:translateY(-5px);
}

.npc.near img{
  filter:
    drop-shadow(0 7px 3px rgba(0,0,0,.28))
    drop-shadow(0 0 13px #fff27c);
}

/* PLAYER */

#player{
  position:absolute;
  width:125px;
  height:170px;
  z-index:30;
  pointer-events:none;
}

#playerImage{
  position:absolute;
  width:115px;
  height:125px;
  left:5px;
  bottom:20px;
  object-fit:contain;
  filter:drop-shadow(0 8px 4px rgba(0,0,0,.35));
}

#playerFallback{
  position:absolute;
  width:100%;
  height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:80px;
  bottom:15px;
}

#playerName{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:0;
  white-space:nowrap;
  padding:6px 12px;
  border-radius:12px;
  background:#241633;
  color:white;
  font-weight:900;
  border:2px solid #fff;
  box-shadow:0 4px 0 rgba(0,0,0,.25);
}

/* HUD */

#hud{
  position:absolute;
  top:15px;
  left:15px;
  z-index:100;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hudBox{
  padding:11px 16px;
  border-radius:15px;
  background:rgba(24,17,43,.9);
  color:white;
  border:2px solid rgba(255,255,255,.3);
  font-weight:900;
  box-shadow:0 5px 0 rgba(0,0,0,.2);
}

#timer{
  color:#ffe675;
}

/* MENU */

#menu{
  position:absolute;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(86,47,132,.5),rgba(9,7,19,.96));
  padding:20px;
}

.menuBox{
  width:min(520px,95vw);
  max-height:90vh;
  overflow:auto;
  padding:30px;
  border-radius:28px;
  background:#211733;
  border:3px solid #8065c8;
  color:white;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.menuBox h1{
  font-size:42px;
  text-align:center;
  margin-bottom:8px;
}

.menuBox p{
  text-align:center;
  opacity:.75;
  margin-bottom:25px;
}

.menuBox label{
  display:block;
  font-weight:900;
  margin:16px 0 7px;
}

.menuBox input[type="text"],
.menuBox input[type="file"]{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:2px solid #65518d;
  background:#130e20;
  color:white;
}

.startButton{
  width:100%;
  margin-top:22px;
  padding:16px;
  border:0;
  border-radius:15px;
  background:#7659ee;
  color:white;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
}

.startButton:hover{
  filter:brightness(1.15);
}

/* INTERAÇÃO */

#interact{
  position:absolute;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  z-index:200;
  display:none;
  min-width:210px;
  padding:15px 25px;
  border:3px solid white;
  border-radius:16px;
  background:#2d1d50;
  color:white;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 7px 0 rgba(0,0,0,.3);
}

#interact.show{
  display:block;
}

/* DIALOG */

#dialog{
  position:absolute;
  left:50%;
  bottom:30px;
  transform:translateX(-50%);
  width:min(700px,94vw);
  z-index:300;
  display:none;
  padding:20px;
  border-radius:20px;
  background:rgba(25,17,40,.97);
  border:3px solid #c7aaff;
  color:white;
  box-shadow:0 15px 50px rgba(0,0,0,.6);
}

#dialog.show{
  display:block;
}

#dialogName{
  font-size:20px;
  font-weight:1000;
  margin-bottom:10px;
  color:#d8c6ff;
}

#dialogText{
  font-size:18px;
  line-height:1.45;
  margin-bottom:15px;
}

.dialogButtons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.dialogButtons button{
  padding:10px 15px;
  border-radius:12px;
  border:2px solid #8b71c7;
  background:#39265c;
  color:white;
  font-weight:900;
  cursor:pointer;
}

#audioArea{
  margin-top:15px;
  display:none;
  background:#130d20;
  border-radius:15px;
  padding:12px;
  text-align:center;
}

#audioArea iframe{
  width:110px;
  height:200px;
  border:0;
}

/* CHAT */

#chat{
  position:absolute;
  right:15px;
  bottom:15px;
  width:300px;
  z-index:150;
  background:rgba(25,17,40,.92);
  border:2px solid rgba(255,255,255,.25);
  border-radius:17px;
  padding:12px;
  color:white;
}

#chatMessages{
  height:100px;
  overflow:auto;
  font-size:13px;
  margin-bottom:8px;
}

.chatLine{
  margin-bottom:5px;
}

#chatForm{
  display:flex;
  gap:5px;
}

#chatInput{
  min-width:0;
  flex:1;
  padding:9px;
  border:0;
  border-radius:9px;
}

#chatForm button{
  padding:9px 12px;
  border:0;
  border-radius:9px;
  background:#7355db;
  color:white;
  font-weight:900;
}

/* MOBILE */

#mobileControls{
  position:absolute;
  left:20px;
  bottom:20px;
  z-index:160;
  display:none;
}

.dpad{
  display:grid;
  grid-template-columns:55px 55px 55px;
  grid-template-rows:55px 55px 55px;
  gap:5px;
}

.dpad button{
  border:2px solid white;
  background:rgba(35,23,54,.85);
  color:white;
  border-radius:12px;
  font-size:24px;
  font-weight:900;
}

.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:3}
.right{grid-column:3;grid-row:2}

@media(max-width:700px){
  #chat{
    width:230px;
    right:10px;
    bottom:10px;
  }

  #mobileControls{
    display:block;
  }

  #interact{
    bottom:175px;
  }

  .menuBox h1{
    font-size:31px;
  }
}

@media(min-width:701px){
  #mobileControls{
    display:none;
  }
}
</style>
</head>

   THE ATTORNEYS
   Tudo fica neste único HTML.

const portal = $("portal");
const timer = $("timer");

const chatForm = $("chatForm");
const chatInput = $("chatInput");
const chatMessages = $("chatMessages");

   PLAYER
========================================================= */

  x:1800,
  y:1500,
  speed:5,
  name:"Player",
  image:null
};

const keys = {
  ArrowUp:false,
  ArrowDown:false,
  ArrowLeft:false,
  ArrowRight:false,
  w:false,
  a:false,
  s:false,
  d:false
};

let gameStarted = false;
let closestNPC = null;
let currentNPC = null;

/* =========================================================
   NPCS
========================================================= */

const npcWalkers = [];

const npcElements = Array.from(document.querySelectorAll(".npc"));

npcElements.forEach((el,index) => {

  const startX = Number(el.dataset.x);
  const startY = Number(el.dataset.y);
  const range = Number(el.dataset.range) || 160;

  el.style.left = startX + "px";
  el.style.top = startY + "px";

  npcWalkers.push({
    el,
    id:el.dataset.id,
    name:el.dataset.name,

    x:startX,
    y:startY,

    homeX:startX,
    homeY:startY,

    range,

    dx:0,
    dy:0,

    speed:0.45 + Math.random() * 0.6,

    nextMove:performance.now() + 500 + Math.random()*1500,

    moving:false
  });

  /*
    Caso uma imagem externa falhe, o NPC ainda fica visível
    com uma representação simples em vez de desaparecer.
  */
  const img = el.querySelector("img");

  img.addEventListener("error",() => {
    img.style.display = "none";

    const fallback = document.createElement("div");

    fallback.style.position = "absolute";
    fallback.style.left = "25px";
    fallback.style.bottom = "30px";
    fallback.style.width = "100px";
    fallback.style.height = "100px";
    fallback.style.display = "flex";
    fallback.style.alignItems = "center";
    fallback.style.justifyContent = "center";
    fallback.style.fontSize = "65px";

    const emojis = {
      oliver:"🌳",
      melanie:"🦋",
      burguinho:"🦆",
      rick:"🧪",
      morty:"😰",
      robot:"🤖",
      yume:"🌙",
      jotaro:"⭐"
    };

    fallback.textContent = emojis[el.dataset.id] || "👤";

    el.appendChild(fallback);
  });

});

/* =========================================================
   ÁUDIOS
========================================================= */

const npcAudio = {

  rick:
    "https://www.myinstants.com/instant/wubba-lubba-dub-dub-2-23931/embed/",

  morty:
    "https://www.myinstants.com/instant/pringels-morty-39542/embed/",

  oliver:
    "https://www.myinstants.com/instant/onionioni-rip-oliver-tree-74616/embed/",

  burguinho:
    "https://www.myinstants.com/instant/mac-quack-83896/embed/",

  melanie:

  robot:
    "https://www.myinstants.com/instant/full-powerrobotic-voice/embed/",

  yume:
    "https://www.myinstants.com/instant/full-powerrobotic-voice/embed/"
};

/* =========================================================
   DIÁLOGOS
========================================================= */

const npcDialogs = {

  rick:
    "Para de ser um idiota, Morty! A gente tá onde eu quiser que a gente esteja!",

  morty:
    "P-porra, Rick! Onde é que a gente tá, cara?!",

    "Oninoninon",

  burguinho:

  melanie:
    "Abuelita open the door!",

  robot:
    "Olá, competidor. Posso informar sobre a próxima prova, regras, mapa, calendário, participantes, perguntas frequentes ou áudios.",

  yume:
    "Oi! Explore bastante o lobby enquanto espera a próxima prova :33",

  jotaro:
    "Yare yare daze..."
};

/* =========================================================
   CONTROLES DO TECLADO
========================================================= */

window.addEventListener("keydown",event => {

  const key = event.key;

  if(key === "ArrowUp" ||
     key === "ArrowDown" ||
     key === "ArrowLeft" ||
     key === "ArrowRight" ||
     key.toLowerCase() === "w" ||
     key.toLowerCase() === "a" ||
     key.toLowerCase() === "s" ||
     key.toLowerCase() === "d"){

    event.preventDefault();
  }

  if(key === "e" || key === "E"){
    if(closestNPC){
      interactWithNPC(closestNPC);
    }
    return;
  }

  if(key === "Escape"){
    closeNPCDialog();
    return;
  }

  if(key === "ArrowUp") keys.ArrowUp = true;
  if(key === "ArrowDown") keys.ArrowDown = true;
  if(key === "ArrowLeft") keys.ArrowLeft = true;
  if(key === "ArrowRight") keys.ArrowRight = true;

  if(key.toLowerCase() === "w") keys.w = true;
  if(key.toLowerCase() === "a") keys.a = true;
  if(key.toLowerCase() === "s") keys.s = true;
  if(key.toLowerCase() === "d") keys.d = true;
});

window.addEventListener("keyup",event => {

  if(event.key === "ArrowUp") keys.ArrowUp = false;
  if(event.key === "ArrowDown") keys.ArrowDown = false;
  if(event.key === "ArrowLeft") keys.ArrowLeft = false;
  if(event.key === "ArrowRight") keys.ArrowRight = false;

  if(event.key.toLowerCase() === "w") keys.w = false;
  if(event.key.toLowerCase() === "a") keys.a = false;
  if(event.key.toLowerCase() === "s") keys.s = false;
  if(event.key.toLowerCase() === "d") keys.d = false;
});

/* =========================================================
   MOVIMENTO DO PLAYER
========================================================= */

function movePlayer(){

  if(!gameStarted) return;

  let dx = 0;
  let dy = 0;

  if(keys.ArrowUp || keys.w) dy -= 1;
  if(keys.ArrowDown || keys.s) dy += 1;
  if(keys.ArrowLeft || keys.a) dx -= 1;
  if(keys.ArrowRight || keys.d) dx += 1;

  if(dx !== 0 || dy !== 0){

    const length = Math.sqrt(dx*dx + dy*dy);

    dx /= length;
    dy /= length;

    playerState.x += dx * playerState.speed;
    playerState.y += dy * playerState.speed;
  }

  /*
    Limites reais do mundo.
  */

  playerState.x = Math.max(
    60,
    Math.min(3540,playerState.x)
  );

  playerState.y = Math.max(
    80,
    Math.min(2510,playerState.y)
  );
}

/* =========================================================
   MOVIMENTO DOS NPCS
========================================================= */

function chooseNPCMove(npc){

  const angle = Math.random() * Math.PI * 2;

  npc.speed = 0.45 + Math.random() * 0.75;

  npc.dx = Math.cos(angle) * npc.speed;
  npc.dy = Math.sin(angle) * npc.speed;

  npc.nextMove =
    performance.now() +
    1000 +
    Math.random() * 2600;

  npc.moving = true;
}

function updateNPCs(){

  const now = performance.now();

  npcWalkers.forEach(npc => {

    if(now >= npc.nextMove){
      chooseNPCMove(npc);
    }

    /*
      Calcula a posição futura.
    */

    let nextX = npc.x + npc.dx;
    let nextY = npc.y + npc.dy;

    const minX = npc.homeX - npc.range;
    const maxX = npc.homeX + npc.range;

    const minY = npc.homeY - npc.range;
    const maxY = npc.homeY + npc.range;

    /*
      Se bater no limite, muda de direção.
    */

    if(nextX < minX || nextX > maxX){

      npc.dx *= -1;

      nextX = npc.x + npc.dx;
    }

    if(nextY < minY || nextY > maxY){

      npc.dy *= -1;

      nextY = npc.y + npc.dy;
    }

    npc.x = Math.max(minX,Math.min(maxX,nextX));
    npc.y = Math.max(minY,Math.min(maxY,nextY));

    npc.el.style.left = npc.x + "px";
    npc.el.style.top = npc.y + "px";

  });
}

/* =========================================================
   DISTÂNCIA
========================================================= */

function distanceBetween(x1,y1,x2,y2){

  const dx = x1 - x2;
  const dy = y1 - y2;

  return Math.sqrt(dx*dx + dy*dy);
}

/* =========================================================
   NPC MAIS PRÓXIMO
========================================================= */

function findClosestNPC(){

  let nearest = null;
  let nearestDistance = Infinity;

  npcWalkers.forEach(npc => {

    /*
      Usamos o centro aproximado do NPC.
    */

    const npcCenterX = npc.x + 75;
    const npcCenterY = npc.y + 90;

    const d = distanceBetween(
      playerState.x + 62,
      playerState.y + 85,
      npcCenterX,
      npcCenterY
    );

    if(d < nearestDistance){

      nearestDistance = d;
      nearest = npc;
    }

  });

  /*
    190 px = distância de interação.
    */

  if(nearest && nearestDistance <= 190){

    return nearest;
  }

  return null;
}

/* =========================================================
   ATUALIZA INTERAÇÃO
========================================================= */

function updateInteraction(){

  const npc = findClosestNPC();

  /*
    Remove destaque anterior.
  */

  npcWalkers.forEach(n => {
    n.el.classList.remove("near");
  });

  closestNPC = npc;

  if(npc){

    npc.el.classList.add("near");

    interact.classList.add("show");

    interactName.textContent =
      " — " + npc.name;

  }else{

    interact.classList.remove("show");

    interactName.textContent = "";
  }
}

/* =========================================================
   INTERAÇÃO
========================================================= */

function interactWithNPC(npc){

  if(!npc) return;

  currentNPC = npc;

  dialogName.textContent = npc.name;

  dialogText.textContent =
    npcDialogs[npc.id] ||
    "Olá! Bem-vindo ao The Attorneys.";

  audioArea.innerHTML = "";
  audioArea.style.display = "none";

  dialog.classList.add("show");

  /*
    Coloca o iframe somente quando interage.
    Isso evita carregar oito players de áudio ao mesmo tempo.
  */

  if(npcAudio[npc.id]){

    const iframe = document.createElement("iframe");

    iframe.width = "110";
    iframe.height = "200";

    iframe.src = npcAudio[npc.id];

    iframe.frameBorder = "0";
    iframe.scrolling = "no";
    iframe.allow = "autoplay";

    audioArea.appendChild(iframe);
  }

}

/* =========================================================
   BOTÃO INTERAGIR
========================================================= */

interact.addEventListener("click",() => {

  if(closestNPC){
    interactWithNPC(closestNPC);
  }

});

/* =========================================================
   CLICAR DIRETO NO NPC
========================================================= */

npcElements.forEach(npcElement => {

  npcElement.addEventListener("click",event => {

    event.stopPropagation();

    const npc = npcWalkers.find(
      n => n.el === npcElement
    );

    if(!npc) return;

    const d = distanceBetween(
      playerState.x + 62,
      playerState.y + 85,
      npc.x + 75,
      npc.y + 90
    );

    if(d <= 260){

      interactWithNPC(npc);

    }else{

      /*
        Não abre a conversa se estiver longe.
      */

      timer.textContent =
        "💬 Chegue mais perto de " + npc.name;

      setTimeout(() => {

        if(portalOpen){
          timer.textContent = "🌀 PORTAL ABERTO!";
        }

      },1800);

    }

  });

});

/* =========================================================
   FECHAR DIÁLOGO
========================================================= */

function closeNPCDialog(){

  dialog.classList.remove("show");

  audioArea.innerHTML = "";
  audioArea.style.display = "none";

  currentNPC = null;
}

closeDialog.addEventListener("click",closeNPCDialog);

/* =========================================================
   REPLAY
========================================================= */

replayAudio.addEventListener("click",() => {

  if(!currentNPC) return;

  audioArea.innerHTML = "";

  if(npcAudio[currentNPC.id]){

    const iframe = document.createElement("iframe");

    iframe.width = "110";
    iframe.height = "200";

    iframe.src =
      npcAudio[currentNPC.id];

    iframe.frameBorder = "0";
    iframe.scrolling = "no";
    iframe.allow = "autoplay";

    audioArea.appendChild(iframe);

    audioArea.style.display = "block";
  }

});

/* =========================================================
   PLAYER / ARQUIVO
========================================================= */

playerFile.addEventListener("change",event => {

  const file = event.target.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){

    alert("Escolha uma imagem.");

    playerFile.value = "";

    return;
  }

  const reader = new FileReader();

  reader.onload = () => {

    playerState.image = reader.result;

    playerImage.src = reader.result;
    playerImage.style.display = "block";

    playerFallback.style.display = "none";
  };

  reader.readAsDataURL(file);

});

/* =========================================================
   START
========================================================= */

startButton.addEventListener("click",() => {

  const typedName =
    nameInput.value.trim();

  playerState.name =
    typedName || "Player";

  playerName.textContent =
    playerState.name;

  gameStarted = true;

  menu.style.display = "none";

  /*
    Começa todos os NPCs imediatamente.
  */

  npcWalkers.forEach((npc,index) => {

    npc.nextMove =
      performance.now() +
      200 +
      index * 120;

    chooseNPCMove(npc);

  });

  timer.textContent =
    "⏳ Portal abrindo em 20s...";

});

/* =========================================================
   CÂMERA
========================================================= */

function updateCamera(){

  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;

  /*
    O player é mantido perto do centro.
  */

  let camX =
    playerState.x -
    screenWidth / 2;

  let camY =
    playerState.y -
    screenHeight / 2;

  /*
    Não deixa a câmera sair do mundo.
  */

  const maxCamX =
    3600 - screenWidth;

  const maxCamY =
    2600 - screenHeight;

  camX =
    Math.max(
      0,
      Math.min(maxCamX,camX)
    );

  camY =
    Math.max(
      0,
      Math.min(maxCamY,camY)
    );

  world.style.transform =
    "translate(" +
    (-camX) +
    "px," +
    (-camY) +
    "px)";

}

/* =========================================================
   POSIÇÃO DO PLAYER
========================================================= */

function updatePlayer(){

  player.style.left =
    playerState.x + "px";

  player.style.top =
    playerState.y + "px";
}

/* =========================================================
   PORTAL
========================================================= */

let portalOpen = false;

function openPortal(){

  portalOpen = true;

  portal.classList.remove(
    "portal-closed"
  );

  portal.classList.add(
    "portal-open"
  );

  timer.textContent =
    "🌀 PORTAL ABERTO!";
}

function closePortal(){

  portalOpen = false;

  portal.classList.remove(
    "portal-open"
  );

  portal.classList.add(
    "portal-closed"
  );

}

/*
  Portal abre 20 segundos depois de entrar.
*/

setTimeout(() => {

  if(gameStarted){
    openPortal();
  }else{

    /*
      Se o jogador ainda estiver no menu,
      o portal abre quando começar.
    */

  }

},20000);

/*
  Quando começa, também agenda o portal.
*/

startButton.addEventListener("click",() => {

  setTimeout(() => {

    openPortal();

  },20000);

});

/* =========================================================
   CLIQUE NO PORTAL
========================================================= */

portal.addEventListener("click",() => {

  if(!portalOpen) return;

  const portalX = 1800;
  const portalY = 1110;

  const d = distanceBetween(
    playerState.x,
    playerState.y,
    portalX,
    portalY
  );

  if(d <= 360){

    dialogName.textContent =
      "🌀 Próxima prova";

    dialogText.textContent =
      "O portal está aberto! A próxima prova espera por você.";

    audioArea.innerHTML = "";
    audioArea.style.display = "none";

    dialog.classList.add("show");

  }else{

    timer.textContent =
      "🌀 Aproxime-se do portal!";

    setTimeout(() => {

      if(portalOpen){
        timer.textContent =
          "🌀 PORTAL ABERTO!";
      }

    },1500);

  }

});

/* =========================================================
   CHAT
========================================================= */

chatForm.addEventListener("submit",event => {

  event.preventDefault();

  const text =
    chatInput.value.trim();

  if(!text) return;

  const line =
    document.createElement("div");

  line.className = "chatLine";

  line.innerHTML =
    "<b>" +
    escapeHTML(playerState.name) +
    ":</b> " +
    escapeHTML(text);

  chatMessages.appendChild(line);

  chatMessages.scrollTop =
    chatMessages.scrollHeight;

  chatInput.value = "";

});

/* =========================================================
   SEGURANÇA DO CHAT
========================================================= */

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* =========================================================
   CONTROLES MOBILE
========================================================= */

document.querySelectorAll(
  "#mobileControls button"
).forEach(button => {

  const key =
    button.dataset.key;

  button.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      keys[key] = true;
    }
  );

  button.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      keys[key] = false;
    }
  );

  button.addEventListener(
    "pointercancel",
    () => {
      keys[key] = false;
    }
  );

  button.addEventListener(
    "pointerleave",
    () => {
      keys[key] = false;
    }
  );

});

/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function gameLoop(){

  /*
    NPCs andam sempre.
  */

  updateNPCs();

  /*
    Player só anda depois de entrar.
  */

  movePlayer();

  updatePlayer();

  updateInteraction();

  updateCamera();

  requestAnimationFrame(gameLoop);
}

/* =========================================================
   POSIÇÃO INICIAL
========================================================= */

updatePlayer();
updateCamera();

/*
  COMEÇA O LOOP IMEDIATAMENTE.
  Isso é importante: NPCs não dependem
  do menu para o loop existir.
*/

npcWalkers.forEach((npc,index) => {

  chooseNPCMove(npc);

});

gameLoop();

</script>
