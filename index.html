<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attorneys</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#17111f;
  color:white;
}

button,input{
  font:inherit;
}

/* =========================
   MENU
========================= */

#menu{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#21172f;
  padding:20px;
}

.menu-box{
  width:min(450px,100%);
  padding:30px;
  border:3px solid #9d72c9;
  border-radius:22px;
  background:#30203e;
  box-shadow:0 15px 50px #0009;
  text-align:center;
}

.menu-box h1{
  font-size:clamp(30px,8vw,46px);
  margin-bottom:8px;
}

.menu-box p{
  color:#d8cbe1;
  line-height:1.45;
  margin-bottom:20px;
}

.menu-box label{
  display:block;
  text-align:left;
  font-weight:bold;
  margin:12px 0 6px;
}

#playerNameInput{
  width:100%;
  padding:13px;
  border:2px solid #75558e;
  border-radius:12px;
  background:#1b1423;
  color:white;
  outline:none;
}

.file-box{
  border:2px dashed #80619a;
  border-radius:14px;
  padding:14px;
  background:#21172c;
}

.file-box input{
  width:100%;
  color:#ddd;
}

.preview-area{
  display:none;
  flex-direction:column;
  align-items:center;
  gap:5px;
  margin-top:12px;
}

.preview-area.show{
  display:flex;
}

.preview-area img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:12px;
  background:#17111f;
}

#fileName{
  font-size:12px;
  color:#aaa;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}

#startGame{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#bd8eea;
  color:#21152b;
  font-weight:900;
  cursor:pointer;
}


/* =========================
   JOGO
========================= */

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
}

#world{
  position:absolute;
  width:3600px;
  height:2600px;
  left:0;
  top:0;
  transform-origin:0 0;
}


/* =========================
   GRAMA
========================= */

#grass{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.30;
  pointer-events:none;
}


/* =========================
   ILHA
========================= */

#island{
  position:absolute;
  left:140px;
  top:120px;
  width:3320px;
  height:2360px;

  border-radius:
    46% 54% 49% 51% /
    45% 48% 52% 55%;

  background:#8fc66b;

  border:22px solid #668f4e;

  box-shadow:
    inset 0 0 0 8px #b8dc88,
    inset 0 0 55px #507c3e;
}


/* =========================
   CAMINHOS
========================= */

.path{
  position:absolute;
  background:#c89a60;
  border:7px solid #a87546;
  box-shadow:inset 0 0 0 5px #dcb477;
}

.path.horizontal{
  height:95px;
  border-radius:60px;
}

.path.vertical{
  width:95px;
  border-radius:60px;
}


/* =========================
   ÁGUA
========================= */

.pond{
  position:absolute;
  background:#63b8d2;
  border:12px solid #397e9a;
  border-radius:50%;
  box-shadow:inset 0 0 0 7px #8dd1dd;
}


/* =========================
   FLORES
========================= */

.flower{
  position:absolute;
  width:52px;
  height:52px;
  object-fit:contain;
  image-rendering:pixelated;
}


/* =========================
   ÁRVORES
========================= */

.tree{
  position:absolute;
  width:150px;
  height:170px;
  object-fit:contain;
}


/* =========================
   PEDRAS
========================= */

.rock{
  position:absolute;
  width:70px;
  height:48px;
  border-radius:50%;
  background:#777;
  box-shadow:inset -8px -5px #555;
}


/* =========================
   ARBUSTOS
========================= */

.bush{
  position:absolute;
  width:110px;
  height:70px;
  border-radius:50%;
  background:#3e7e47;
  box-shadow:
    20px -15px #4d914f,
    45px -5px #397642,
    inset -10px -10px #285d35;
}


/* =========================
   NPC
========================= */

.npc{
  position:absolute;
  width:150px;
  text-align:center;
  z-index:20;
}

.npc img{
  width:115px;
  height:130px;
  object-fit:contain;
  display:block;
  margin:0 auto;
  filter:drop-shadow(0 8px 4px #0008);
}

.npc-name{
  position:absolute;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);

  padding:6px 10px;

  border-radius:10px;

  background:#171322e8;
  border:2px solid #ffffff45;

  font-size:14px;
  font-weight:900;

  white-space:nowrap;
  pointer-events:none;
}


/* =========================
   PLAYER
========================= */

#playerCharacter{
  position:absolute;

  width:105px;
  height:125px;

  object-fit:contain;

  z-index:30;

  filter:drop-shadow(0 8px 4px #0008);
}

#playerNameTag{
  position:absolute;
  z-index:31;

  padding:6px 10px;

  background:#171322ee;
  border:2px solid #ffffff45;
  border-radius:10px;

  font-size:14px;
  font-weight:900;

  white-space:nowrap;
  pointer-events:none;

  transform:translate(-50%,-100%);
}


/* =========================
   PORTAL
========================= */

#portal{
  position:absolute;

  width:180px;
  height:220px;

  border-radius:50% 50% 18% 18%;

  background:
    radial-gradient(
      ellipse,
      #fff 0%,
      #e1b5ff 12%,
      #914ee8 43%,
      #35165d 70%,
      transparent 72%
    );

  box-shadow:0 0 45px #c889ff;

  z-index:15;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  padding-bottom:12px;

  font-weight:900;

  text-shadow:0 2px 5px #000;

  animation:portalPulse 1.5s infinite;
}

#portal.hidden{
  display:none;
}

@keyframes portalPulse{
  50%{
    transform:scale(1.07);
  }
}


/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  inset:0;
  z-index:100;
  pointer-events:none;
}

#top-left{
  position:absolute;
  top:12px;
  left:12px;

  background:#171322e8;
  border:2px solid #ffffff35;
  border-radius:12px;

  padding:10px 14px;

  font-weight:bold;
}

#timer{
  position:absolute;
  top:12px;
  right:12px;

  background:#171322e8;
  border:2px solid #ffffff35;
  border-radius:12px;

  padding:10px 14px;

  font-weight:bold;
}


/* =========================
   CHAT
========================= */

#chat{
  position:absolute;
  right:12px;
  top:62px;

  width:230px;

  padding:10px;

  background:#171322dd;
  border:2px solid #ffffff25;
  border-radius:13px;

  pointer-events:auto;
}

#chatLog{
  height:80px;
  overflow-y:auto;
  font-size:12px;
  margin-bottom:7px;
}

.chat-row{
  display:flex;
  gap:5px;
}

#chatInput{
  min-width:0;
  flex:1;

  padding:7px;

  border-radius:8px;
  border:1px solid #ffffff25;

  background:#ffffff10;
  color:white;
  outline:none;
}

#chatSend{
  border:0;
  border-radius:8px;
  padding:7px;
  cursor:pointer;
}


/* =========================
   DIÁLOGO
========================= */

#dialog{
  position:absolute;

  left:8%;
  right:8%;
  bottom:75px;

  background:#171322f7;

  border:2px solid #ffffff35;
  border-radius:17px;

  padding:16px;

  display:none;

  pointer-events:auto;
}

#dialog.show{
  display:block;
}

#dialogTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:7px;
}

#dialogText{
  color:#ddd;
  line-height:1.5;
  white-space:pre-line;
}

#audioContainer{
  margin-top:12px;
  display:none;
}

#audioContainer.show{
  display:block;
}

#audioContainer iframe{
  display:block;
  width:110px;
  height:200px;
  border:0;
  margin:0;
}

.dialog-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.dialog-buttons button{
  padding:9px 13px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

#replay{
  background:#bd8eea;
}

#closeDialog{
  background:#ffffff18;
  color:white;
  border:1px solid #ffffff25;
}


/* =========================
   CONTROLES
========================= */

#interact{
  position:absolute;

  right:15px;
  bottom:15px;

  padding:13px 18px;

  border:0;
  border-radius:12px;

  background:#bd8eea;

  color:#201426;

  font-weight:bold;

  pointer-events:auto;
  cursor:pointer;
}

#mobileControls{
  position:absolute;

  left:12px;
  bottom:12px;

  display:grid;

  grid-template-columns:48px 48px 48px;

  gap:5px;

  pointer-events:auto;
}

#mobileControls button{
  width:48px;
  height:48px;

  border-radius:11px;
  border:1px solid #ffffff30;

  background:#171322cc;
  color:white;

  font-size:19px;
  font-weight:bold;
}

#mobileUp{
  grid-column:2;
}

#mobileLeft{
  grid-column:1;
}

#mobileDown{
  grid-column:2;
}

#mobileRight{
  grid-column:3;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #chat{
    width:190px;
    top:60px;
  }

  #dialog{
    left:4%;
    right:4%;
  }

  .npc-name{
    font-size:12px;
  }

}
</style>
</head>

const playerNameInput =
  document.getElementById("playerNameInput");

const playerImageInput =
  document.getElementById("playerImageInput");

const playerPreview =
  document.getElementById("playerPreview");

const previewArea =
  document.getElementById("previewArea");

const fileName =
  document.getElementById("fileName");

const playerNameTag =
  document.getElementById("playerNameTag");

const nameBadge =
  document.getElementById("top-left");

const timer =
  document.getElementById("timer");

const portal =
  document.getElementById("portal");

const dialog =
  document.getElementById("dialog");

const dialogTitle =
  document.getElementById("dialogTitle");

const dialogText =
  document.getElementById("dialogText");

const audioContainer =
  document.getElementById("audioContainer");

const replayButton =
  document.getElementById("replay");

const chatInput =
  document.getElementById("chatInput");

const chatLog =
  document.getElementById("chatLog");

const chatSend =
  document.getElementById("chatSend");

/* =====================================================
   ESTADO
===================================================== */

let playerImage = "";
let playerName = "Jogador";

let x = 1750;
let y = 1250;

let keys = new Set();
let lastNpc = null;
let portalOpen = false;
let endTime = 0;
let cameraX = 0;
let cameraY = 0;

const speed = 6;

/* =====================================================
   IMAGEM DO PLAYER
===================================================== */

playerImageInput.addEventListener(
  "change",
  function(){
    const file =
      playerImageInput.files[0];

    if(!file){
      return;
    }

    if(!file.type.startsWith("image/")){
      alert("Escolha uma imagem PNG, JPG, WEBP ou GIF.");
      playerImageInput.value = "";
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(){
        playerImage = reader.result;
        playerPreview.src = playerImage;
        previewArea.classList.add("show");
        fileName.textContent = file.name;
      };

    reader.readAsDataURL(file);
  }
);


/* =====================================================
   COMEÇAR JOGO
===================================================== */

document
  .getElementById("startGame")
  .addEventListener(
    "click",
    startGame
  );

function startGame(){
  playerName =
    playerNameInput.value.trim() || "Jogador";

  if(playerImage){
    player.src = playerImage;
  }else{
    player.src =
      "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="120"
        >
          <text
            x="50"
            y="75"
            text-anchor="middle"
            font-size="65"
            font-family="Arial"
          >
            🧑
          </text>
        </svg>
      `);
  }

  playerNameTag.textContent =
    playerName;
  playerNameTag.style.display = "block";

  menu.style.display = "none";
  game.hidden = false;

  endTime = Date.now() + 15000;
  requestAnimationFrame(loop);
}


/* =====================================================
   TECLADO
===================================================== */

window.addEventListener(
  "keydown",
  function(event){
    const active =
      document.activeElement;

    if(
      active &&
      (
        active.tagName === "INPUT" ||
        active.tagName === "TEXTAREA" ||
        active.isContentEditable
      )
    ){
      return;
    }

    const movementKeys = [
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      "w",
      "a",
      "s",
      "d",
      "W",
      "A",
      "S",
      "D"
    ];

    if(
      movementKeys.includes(event.key)
    ){
      event.preventDefault();
      keys.add(event.key);
    }

    if(
      event.key.toLowerCase() === "e"
    ){
      interact();
    }
  }
);

window.addEventListener(
  "keyup",
  function(event){
    keys.delete(event.key);
  }
);


/* =====================================================
   CONTROLES MOBILE
===================================================== */

document
  .querySelectorAll(
    "#mobileControls button"
  )
  .forEach(
    function(button){
      button.addEventListener(
        "pointerdown",
        function(event){
          event.preventDefault();
          keys.add(button.dataset.key);
        }
      );

      button.addEventListener(
        "pointerup",
        function(){
          keys.delete(button.dataset.key);
        }
      );

      button.addEventListener(
        "pointercancel",
        function(){
          keys.delete(button.dataset.key);
        }
      );

      button.addEventListener(
        "pointerleave",
        function(){
          keys.delete(button.dataset.key);
        }
      );
    }
  );


/* =====================================================
   MOVIMENTO
===================================================== */

function updateMovement(){
  let dx = 0;
  let dy = 0;

  if(
    keys.has("ArrowUp") ||
    keys.has("w") ||
    keys.has("W")
  ){
    dy -= speed;
  }

  if(
    keys.has("ArrowDown") ||
    keys.has("s") ||
    keys.has("S")
  ){
    dy += speed;
  }

  if(
    keys.has("ArrowLeft") ||
    keys.has("a") ||
    keys.has("A")
  ){
    dx -= speed;
  }

  if(
    keys.has("ArrowRight") ||
    keys.has("d") ||
    keys.has("D")
  ){
    dx += speed;
  }

  if(dx !== 0 && dy !== 0){
    dx *= 0.707;
    dy *= 0.707;
  }

  x += dx;
  y += dy;

  x = Math.max(170, Math.min(3350, x));
  y = Math.max(150, Math.min(2380, y));
}


/* =====================================================
   CÂMERA
===================================================== */

function updateCamera(){
  const screenWidth =
    game.clientWidth;
  const screenHeight =
    game.clientHeight;

  cameraX = x - screenWidth / 2;
  cameraY = y - screenHeight / 2;

  const maxCameraX =
    3600 - screenWidth;

  const maxCameraY =
    2600 - screenHeight;

  cameraX = Math.max(0, Math.min(maxCameraX, cameraX));
  cameraY = Math.max(0, Math.min(maxCameraY, cameraY));

  world.style.transform =
    `translate(${-cameraX}px, ${-cameraY}px)`;
}


/* =====================================================
   POSIÇÃO DO PLAYER
===================================================== */

function updatePlayer(){
  player.style.left =
    `${x - 52}px`;

  player.style.top =
    `${y - 62}px`;

  playerNameTag.style.left =
    `${x}px`;

  playerNameTag.style.top =
    `${y - 68}px`;
}


/* =====================================================
   NPC MAIS PRÓXIMO
===================================================== */

function getNearestNPC(){
  const npcs =
    document.querySelectorAll(".npc");

  let nearest = null;
  let nearestDistance = Infinity;

  npcs.forEach(
    function(npc){
      const nx =
        parseFloat(npc.style.left) + 75;

      const ny =
        parseFloat(npc.style.top) + 65;

      const distance =
        Math.hypot(
          x - nx,
          y - ny
        );

      if(
        distance < nearestDistance
      ){
        nearestDistance = distance;
        nearest = npc;
      }
    }
  );

  if(
    nearestDistance <= 190
  ){
    return nearest;
  }

  return null;
}


/* =====================================================
   INTERAÇÃO
===================================================== */

function playNpcAudio(id){
  const audioHtml =
    AUDIO_IFRAMES[id];

  if(!audioHtml){
    audioContainer.innerHTML = "";
    audioContainer.classList.remove("show");
    replayButton.style.display = "none";
    return;
  }

  audioContainer.innerHTML =
    audioHtml;

  audioContainer.classList.add("show");
  replayButton.style.display = "block";
}

function interact(){
  if(game.hidden){
    return;
  }

  const npc =
    getNearestNPC();

  if(!npc){
    closeDialog();
    return;
  }

  const id =
    npc.dataset.id;

  lastNpc = id;

  dialogTitle.textContent =
    npc.querySelector(".npc-name").textContent;

  dialogText.textContent =
    NPC_TEXT[id] || "...";

  playNpcAudio(id);

  dialog.classList.add("show");
}


/* =====================================================
   FECHAR DIÁLOGO
===================================================== */

document
  .getElementById("closeDialog")
  .addEventListener(
    "click",
    closeDialog
  );

function closeDialog(){
  dialog.classList.remove("show");

  audioContainer.innerHTML =
    "";

  audioContainer.classList.remove("show");

  replayButton.style.display =
    "none";

  lastNpc = null;
}


/* =====================================================
   REPETIR ÁUDIO
===================================================== */

replayButton.addEventListener(
  "click",
  function(){
    if(!lastNpc){
      return;
    }

    playNpcAudio(lastNpc);
  }
);


/* =====================================================
   CHAT
===================================================== */

chatSend.addEventListener(
  "click",
  sendChat
);

chatInput.addEventListener(
  "keydown",
  function(event){
    if(
      event.key === "Enter"
    ){
      event.preventDefault();
      sendChat();
    }
  }
);

function sendChat(){
  const message =
    chatInput.value.trim();

  if(!message){
    return;
  }

  const row =
    document.createElement("div");

  row.textContent =
    `${playerName}: ${message}`;

  chatLog.appendChild(row);
  chatLog.scrollTop =
    chatLog.scrollHeight;

  chatInput.value =
    "";
}


/* =====================================================
   PORTAL / TIMER
===================================================== */

function updateTimer(){
  const remaining =
    Math.max(
      0,
      Math.ceil((endTime - Date.now()) / 1000)
    );

  if(
    remaining > 0
  ){
    timer.textContent =
      `PORTAL EM ${remaining}s`;
  }else{
    if(!portalOpen){
      portalOpen = true;
      portal.classList.remove("hidden");
    }

    timer.textContent =
      "PORTAL ABERTO!";
  }
}


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function loop(){
  updateMovement();
  updatePlayer();
  updateCamera();
  updateTimer();

  requestAnimationFrame(loop);
}


/* =====================================================
   INTERAGIR PELO BOTÃO
===================================================== */

document
  .getElementById("interact")
  .addEventListener(
    "click",
    interact
  );


/* =====================================================
   AJUSTAR CÂMERA AO REDIMENSIONAR
===================================================== */

window.addEventListener(
  "resize",
  function(){
    if(!game.hidden){
      updateCamera();
    }
  }
);

</script>

</body>
</html>
