<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💥 The Attorneys Legacy: O Confronto</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #171020;
}

/* =========================
   MENU
========================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

    background:
        radial-gradient(circle at 20% 20%, rgba(190,120,255,.28), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(90,30,150,.4), transparent 35%),
        linear-gradient(135deg, #26133d, #100c1d 70%);
}

.menuDecor {
    position: absolute;
    border-radius: 50%;
    filter: blur(2px);
    opacity: .35;
}

.decor1 {
    width: 300px;
    height: 300px;
    background: #a85cff;
    top: -100px;
    left: -100px;
}

.decor2 {
    width: 240px;
    height: 240px;
    background: #ff65c8;
    bottom: -100px;
    right: -60px;
}

.menuBox {
    position: relative;
    width: min(92vw, 500px);
    padding: 42px 35px;
    border-radius: 28px;

    background: rgba(20, 12, 32, .82);
    border: 2px solid rgba(255,255,255,.15);
    box-shadow:
        0 25px 80px rgba(0,0,0,.5),
        inset 0 0 40px rgba(255,255,255,.03);

    text-align: center;
    color: white;
    backdrop-filter: blur(14px);
}

.logo {
    font-size: clamp(38px, 9vw, 66px);
    font-weight: 1000;
    letter-spacing: -3px;
    text-shadow:
        0 5px 0 #55208a,
        0 12px 30px rgba(0,0,0,.5);
}

.subtitle {
    margin-top: 5px;
    color: #d9b9ff;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.nameInput {
    width: 100%;
    margin-top: 32px;
    padding: 15px 18px;

    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;

    outline: none;
    background: rgba(255,255,255,.08);
    color: white;
    font-size: 16px;
}

.nameInput::placeholder {
    color: #aaa0b4;
}

.startButton {
    width: 100%;
    margin-top: 14px;
    padding: 16px;

    border: none;
    border-radius: 14px;

    background: linear-gradient(135deg, #b75cff, #7434cf);
    color: white;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 25px rgba(130,50,220,.35);
    transition: .2s;
}

.startButton:hover {
    transform: translateY(-2px);
    filter: brightness(1.12);
}

.tip {
    margin-top: 18px;
    color: #aaa0b4;
    font-size: 12px;
}

/* =========================
   GAME
========================= */

#game {
    position: fixed;
    inset: 0;
    overflow: hidden;
    display: none;

    background: #8bcf7a;
}

/* céu */

#sky {
    position: absolute;
    inset: 0 0 42% 0;

    background:
        linear-gradient(
            to bottom,
            #75bdf0 0%,
            #bce8ff 65%,
            #e9f8ff 100%
        );

    z-index: 0;
}

/* nuvens */

.cloud {
    position: absolute;
    width: 130px;
    height: 45px;
    border-radius: 50px;
    background: rgba(255,255,255,.7);
    filter: blur(1px);
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: inherit;
}

.cloud::before {
    width: 55px;
    height: 55px;
    left: 20px;
    top: -22px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    top: -30px;
}

.cloud1 {
    top: 12%;
    left: 8%;
}

.cloud2 {
    top: 18%;
    right: 12%;
    transform: scale(.75);
}

/* =========================
   CAMPO EM PERSPECTIVA
========================= */

#field {
    position: absolute;

    left: -15%;
    right: -15%;
    top: 31%;
    bottom: -35%;

    z-index: 2;

    /*
       Essa é a parte que cria a sensação
       de chão visto em perspectiva.
    */

    transform:
        perspective(650px)
        rotateX(48deg);

    transform-origin: center top;

    background-image:
        url("COLE_AQUI_A_URL_DA_GRAMA_REAL");

    background-size: 420px 420px;
    background-repeat: repeat;

    box-shadow:
        inset 0 80px 100px rgba(255,255,255,.15);
}

/* sombra de profundidade */

#field::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,.2),
            transparent 15%,
            rgba(0,0,0,.08) 100%
        );
}

/* =========================
   MUNDO
========================= */

#world {
    position: absolute;
    inset: 0;
    z-index: 5;

    pointer-events: none;
}

/*
   Todos os objetos usam coordenadas
   de profundidade.
*/

.object {
    position: absolute;
    transform-origin: center bottom;
    pointer-events: none;
}

/* árvores */

.tree {
    width: 115px;
    height: 150px;

    background-image:
        url("https://png.pngtree.com/png-clipart/20240510/original/pngtree-a-tree-in-pixel-art-style-png-image_15060072.png");

    background-size: contain;
    background-repeat: no-repeat;
    background-position: center bottom;

    filter: drop-shadow(0 15px 8px rgba(0,0,0,.22));
}

/* flores */

.flower {
    width: 42px;
    height: 42px;

    background-image:
        url("https://png.pngtree.com/png-clipart/20231026/original/pngtree-flower-pixel-morada-png-image_13436332.png");

    background-size: contain;
    background-repeat: no-repeat;
}

/* pedras */

.rock {
    width: 55px;
    height: 35px;

    background-image:
        url("https://static.vecteezy.com/system/resources/previews/019/527/056/non_2x/an-8-bit-retro-styled-pixel-art-illustration-of-a-stone-rock-free-png.png");

    background-size: contain;
    background-repeat: no-repeat;
}

/* =========================
   ARENA
========================= */

#arena {
    position: absolute;

    width: 330px;
    height: 150px;

    left: 50%;
    top: 40%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            #e8d7a3 0%,
            #c5a56c 62%,
            #967343 100%
        );

    border: 12px solid #5b3c25;

    box-shadow:
        0 18px 25px rgba(0,0,0,.3);

    z-index: 4;
}

.arenaInner {
    position: absolute;
    inset: 15px;

    border: 4px dashed rgba(255,255,255,.7);
    border-radius: 50%;
}

.arenaTitle {
    position: absolute;
    left: 50%;
    top: -42px;

    transform: translateX(-50%);

    padding: 7px 18px;

    border-radius: 20px;

    background: #42224f;
    color: white;

    font-size: 13px;
    font-weight: bold;

    white-space: nowrap;
}

/* =========================
   BANDEIRAS
========================= */

.flag {
    position: absolute;

    width: 70px;
    height: 120px;

    z-index: 6;
}

.flagPole {
    position: absolute;
    bottom: 0;
    left: 32px;

    width: 6px;
    height: 100px;

    background: #5b3827;
    border-radius: 5px;
}

.flagCloth {
    position: absolute;

    left: 37px;
    top: 8px;

    width: 42px;
    height: 30px;

    background: #8c42d4;

    clip-path: polygon(
        0 0,
        100% 0,
        80% 50%,
        100% 100%,
        0 100%
    );
}

/* =========================
   PERSONAGEM
========================= */

#player {
    position: absolute;

    width: 90px;
    height: 125px;

    left: 50%;
    top: 67%;

    transform:
        translate(-50%, -100%);

    z-index: 100;

    transition: filter .1s;
}

#player img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(0 9px 5px rgba(0,0,0,.35));
}

/*
   Caso você ainda não coloque uma imagem,
   aparece um personagem temporário.
*/

.playerFallback {
    width: 62px;
    height: 90px;

    margin: auto;

    border-radius: 35px 35px 20px 20px;

    background:
        linear-gradient(
            to bottom,
            #f0c5a8 0 30%,
            #8d48bd 30% 70%,
            #33243c 70%
        );

    border: 3px solid rgba(255,255,255,.6);
}

/* =========================
   NPC
========================= */

.npc {
    position: absolute;

    width: 90px;
    height: 120px;

    z-index: 80;

    transform: translate(-50%, -100%);

    cursor: pointer;
    pointer-events: auto;
}

.npc img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    filter:
        drop-shadow(0 9px 5px rgba(0,0,0,.35));
}

.npcName {
    position: absolute;

    left: 50%;
    bottom: -7px;

    transform: translateX(-50%);

    padding: 5px 9px;

    border-radius: 10px;

    background: rgba(20,10,30,.8);

    color: white;

    font-size: 11px;
    font-weight: bold;

    white-space: nowrap;
}

/* =========================
   HUD
========================= */

#hud {
    position: absolute;

    top: 15px;
    left: 15px;
    right: 15px;

    z-index: 500;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}

.hudBox {
    padding: 10px 14px;

    border-radius: 14px;

    background: rgba(25,15,35,.78);

    color: white;

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(8px);
}

.hudTitle {
    font-size: 11px;
    color: #cdb3dc;
}

.hudValue {
    font-size: 17px;
    font-weight: bold;
}

/* =========================
   EVENTO
========================= */

#eventBanner {
    position: absolute;

    left: 50%;
    top: 16px;

    transform: translateX(-50%);

    z-index: 600;

    padding: 10px 22px;

    border-radius: 30px;

    background: rgba(45,20,60,.85);

    border: 1px solid rgba(255,255,255,.15);

    color: white;

    font-size: 13px;
    font-weight: bold;

    pointer-events: none;
}

/* =========================
   CHAT
========================= */

#chat {
    position: absolute;

    left: 15px;
    bottom: 15px;

    width: min(330px, 70vw);

    z-index: 700;

    pointer-events: auto;
}

.chatMessages {
    height: 100px;

    overflow-y: auto;

    padding: 10px;

    border-radius: 14px 14px 0 0;

    background: rgba(20,12,30,.75);

    color: white;

    font-size: 12px;
}

.chatInput {
    width: 100%;

    padding: 11px;

    border: none;

    outline: none;

    border-radius: 0 0 14px 14px;

    background: rgba(255,255,255,.9);
}

/* =========================
   CONTROLES MOBILE
========================= */

#mobileControls {
    position: absolute;

    right: 20px;
    bottom: 20px;

    z-index: 800;

    display: none;

    width: 130px;
    height: 130px;
}

.control {
    position: absolute;

    width: 45px;
    height: 45px;

    border-radius: 13px;

    border: 1px solid rgba(255,255,255,.2);

    background: rgba(35,20,45,.75);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.up {
    left: 42px;
    top: 0;
}

.down {
    left: 42px;
    bottom: 0;
}

.left {
    left: 0;
    top: 42px;
}

.right {
    right: 0;
    top: 42px;
}

/* =========================
   MODAL
========================= */

#modal {
    position: fixed;
    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.55);
}

.modalBox {
    width: min(90vw, 430px);

    padding: 28px;

    border-radius: 24px;

    background: #24152e;

    color: white;

    border: 1px solid rgba(255,255,255,.15);

    box-shadow: 0 20px 70px rgba(0,0,0,.5);

    text-align: center;
}

.modalBox h2 {
    margin-bottom: 12px;
}

.modalBox p {
    color: #d4c5da;
    line-height: 1.5;
}

.closeButton {
    margin-top: 20px;

    border: none;

    padding: 11px 22px;

    border-radius: 12px;

    background: #8e45c9;

    color: white;

    cursor: pointer;
}

/* =========================
   RESPONSIVO
========================= */

@media (max-width: 700px) {

    #mobileControls {
        display: block;
    }

    #chat {
        width: 55vw;
    }

    #arena {
        width: 260px;
        height: 120px;
    }

    #player {
        width: 75px;
        height: 105px;
    }

    .npc {
        width: 70px;
        height: 95px;
    }

    .eventBanner {
        max-width: 80vw;
        text-align: center;
    }
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="menuDecor decor1"></div>
    <div class="menuDecor decor2"></div>

    <div class="menuBox">

        <div class="logo">
           💥 The Attorneys Legacy: O Confronto
        </div>

        <div class="subtitle">

        </div>

        <input
            id="nameInput"
            class="nameInput"

<!-- =========================

    <!-- CHÃO -->

        <div id="arena">

<script>

/* =========================
   CONFIGURAÇÃO
========================= */

let playerName = "Jogador";

let playerX = 50;
let playerY = 67;

let speed = 0.45;

const keys = {};


/* =========================
   COMEÇAR
========================= */

function startGame() {

    const input =
        document.getElementById("nameInput");

    if (input.value.trim() !== "") {
        playerName = input.value.trim();
    }

    document.getElementById("playerName")
        .textContent = playerName;

    document.getElementById("menu")
        .style.display = "none";

    document.getElementById("game")
        .style.display = "block";

    updatePlayer();
}


/* =========================
   TECLADO
========================= */

window.addEventListener(
    "keydown",
    function(event) {

        keys[event.key.toLowerCase()] = true;

        if (
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight"
            ].includes(event.key)
        ) {
            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        keys[event.key.toLowerCase()] = false;

    }
);


/* =========================
   MOVIMENTO
========================= */

function movePlayer() {

    let moved = false;

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        playerY -= speed;
        moved = true;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        playerY += speed;
        moved = true;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        playerX -= speed;
        moved = true;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        playerX += speed;
        moved = true;
    }


    /* limites */

    playerX = Math.max(
        5,
        Math.min(95, playerX)
    );

    playerY = Math.max(
        42,
        Math.min(92, playerY)
    );


    if (moved) {
        updatePlayer();
    }

    requestAnimationFrame(movePlayer);
}


/* =========================
   PERSPECTIVA DO PLAYER
========================= */

function updatePlayer() {

    const player =
        document.getElementById("player");

    /*
       Quanto mais para baixo,
       maior o personagem.

       Isso cria o efeito de profundidade.
    */

    const depth =
        (playerY - 42) / 50;

    const scale =
        0.72 + depth * 0.45;

    player.style.left =
        playerX + "%";

    player.style.top =
        playerY + "%";

    player.style.transform =
        `translate(-50%, -100%) scale(${scale})`;
}


/* =========================
   NPC
========================= */

function openNPC(name) {

    const modal =
        document.getElementById("modal");

    const title =
        document.getElementById("modalTitle");

    const text =
        document.getElementById("modalText");


    title.textContent = name;


    if (name === "Burguinho") {

        text.textContent =
            "Piu! Bem-vindo ao campo do The Attorneys! Aqui você poderá descobrir informações sobre as provas e os eventos.";

    } else {

        text.textContent =
            "Eu sou o centro de informações do torneio. Em uma versão futura você poderá consultar regras, próximas provas, calendário, participantes e muito mais.";

    }


    modal.style.display = "flex";
}


function closeNPC() {

    document.getElementById("modal")
        .style.display = "none";

}


/* =========================
   CHAT
========================= */

const chatInput =
    document.getElementById("chatInput");

const chatMessages =
    document.getElementById("chatMessages");


chatInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            chatInput.value.trim() !== ""
        ) {

            const message =
                document.createElement("div");

            message.innerHTML =
                `<b>${escapeHTML(playerName)}:</b> ${escapeHTML(chatInput.value)}`;

            chatMessages.appendChild(message);

            chatMessages.scrollTop =
                chatMessages.scrollHeight;

            chatInput.value = "";
        }

    }
);


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   CONTROLES MOBILE
========================= */

document
    .querySelectorAll(".control")
    .forEach(button => {

        const key =
            button.dataset.key.toLowerCase();


        button.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                keys[key] = true;

            },
            { passive: false }
        );


        button.addEventListener(
            "touchend",
            function(event) {

                event.preventDefault();

                keys[key] = false;

            },
            { passive: false }
        );

    });


/* =========================
   INICIAR LOOP
========================= */

movePlayer();

</script>
