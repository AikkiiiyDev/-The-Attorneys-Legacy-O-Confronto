<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Attorneys</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#17111f;
  color:#fff;
}

button,
input{
  font:inherit;
}

/* =========================
   MENU
========================= */

#menu{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#21172f;
  padding:20px;
}

.menu-box{
  width:min(450px,100%);
  padding:30px;
  border:3px solid #9d72c9;
  border-radius:22px;
  background:#30203e;
  box-shadow:0 15px 50px #0009;
  text-align:center;
}

.menu-box h1{
  font-size:clamp(30px,8vw,46px);
  margin-bottom:8px;
}

.menu-box p{
  color:#d8cbe1;
  line-height:1.45;
  margin-bottom:20px;
}

.menu-box label{
  display:block;
  text-align:left;
  font-weight:bold;
  margin:12px 0 6px;
}

.menu-box input[type="text"]{
  width:100%;
  padding:13px;
  border:2px solid #75558e;
  border-radius:12px;
  background:#1b1423;
  color:#fff;
  outline:none;
}

.file-box{
  border:2px dashed #80619a;
  border-radius:14px;
  padding:14px;
  margin-top:7px;
  background:#21172c;
}

.file-box input[type="file"]{
  width:100%;
  color:#ddd;
  font-size:14px;
}

.preview-area{
  margin-top:12px;
  display:none;
  justify-content:center;
  flex-direction:column;
  align-items:center;
  gap:5px;
}

.preview-area.show{
  display:flex;
}

.preview-area img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:12px;
  background:#17111f;
}

#fileName{
  font-size:12px;
  color:#aaa;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}

#startGame{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#bd8eea;
  color:#21152b;
  font-weight:900;
  cursor:pointer;
}

#startGame:hover{
  filter:brightness(1.08);
}


/* =========================
   JOGO
========================= */

#game{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  touch-action:none;
}

#world{
  position:absolute;
  width:3600px;
  height:2600px;
  left:0;
  top:0;
  transform-origin:0 0;
}


/* =========================
   GRAMA
========================= */

#grass{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:.30;
  image-rendering:auto;
  pointer-events:none;
}


/* =========================
   ILHA
========================= */

#island{
  position:absolute;
  left:140px;
  top:120px;
  width:3320px;
  height:2360px;

  border-radius:
    46% 54% 49% 51% /
    45% 48% 52% 55%;

  background:#8fc66b;

  border:22px solid #668f4e;

  box-shadow:
    inset 0 0 0 8px #b8dc88,
    inset 0 0 55px #507c3e;
}


/* =========================
   CAMINHOS
========================= */

.path{
  position:absolute;
  background:#c89a60;
  border:7px solid #a87546;
  box-shadow:
    inset 0 0 0 5px #dcb477;
}

.path.horizontal{
  height:95px;
  border-radius:60px;
}

.path.vertical{
  width:95px;
  border-radius:60px;
}


/* =========================
   ÁGUA
========================= */

.pond{
  position:absolute;
  background:#63b8d2;
  border:12px solid #397e9a;
  border-radius:50%;

  box-shadow:
    inset 0 0 0 7px #8dd1dd;
}


/* =========================
   FLORES
========================= */

.flower{
  position:absolute;
  width:52px;
  height:52px;
  object-fit:contain;
  image-rendering:pixelated;
}


/* =========================
   ÁRVORES
========================= */

.tree{
  position:absolute;
  width:150px;
  height:170px;
  object-fit:contain;
}


/* =========================
   PEDRAS
========================= */

.rock{
  position:absolute;
  width:70px;
  height:48px;
  border-radius:50%;
  background:#777;

  box-shadow:
    inset -8px -5px #555;
}


/* =========================
   ARBUSTOS
========================= */

.bush{
  position:absolute;
  width:110px;
  height:70px;
  border-radius:50%;
  background:#3e7e47;

  box-shadow:
    20px -15px #4d914f,
    45px -5px #397642,
    inset -10px -10px #285d35;
}


/* =========================
   NPC
========================= */

.npc{
  position:absolute;
  width:150px;
  text-align:center;
  z-index:20;
}

.npc img{
  width:115px;
  height:130px;
  object-fit:contain;
  display:block;
  margin:0 auto;

  filter:
    drop-shadow(0 8px 4px #0008);
}


/*
   NOME AGORA FICA EM CIMA
*/

.npc-name{
  position:absolute;

  left:50%;
  bottom:125px;

  transform:translateX(-50%);

  padding:6px 10px;

  border-radius:10px;

  background:#171322e8;

  border:2px solid #ffffff45;

  font-size:14px;
  font-weight:900;

  white-space:nowrap;

  pointer-events:none;
}


/* =========================
   PLAYER
========================= */

#playerCharacter{
  position:absolute;

  width:105px;
  height:125px;

  object-fit:contain;

  z-index:30;

  filter:
    drop-shadow(0 8px 4px #0008);
}


/*
   NOME DO PLAYER EM CIMA
*/

#playerNameTag{
  position:absolute;

  z-index:31;

  padding:6px 10px;

  background:#171322ee;

  border:2px solid #ffffff45;

  border-radius:10px;

  font-size:14px;

  font-weight:900;

  white-space:nowrap;

  pointer-events:none;

  transform:translate(-50%,-100%);
}


/* =========================
   PORTAL
========================= */

#portal{
  position:absolute;

  width:180px;
  height:220px;

  border-radius:
    50% 50% 18% 18%;

  background:
    radial-gradient(
      ellipse,
      #fff 0%,
      #e1b5ff 12%,
      #914ee8 43%,
      #35165d 70%,
      transparent 72%
    );

  box-shadow:
    0 0 45px #c889ff;

  z-index:15;

  display:flex;
  align-items:flex-end;
  justify-content:center;

  padding-bottom:12px;

  font-weight:900;

  text-shadow:
    0 2px 5px #000;

  animation:
    portalPulse 1.5s infinite;
}

#portal.hidden{
  display:none;
}

@keyframes portalPulse{

  50%{
    transform:scale(1.07);
  }

}


/* =========================
   HUD
========================= */

#hud{
  position:absolute;
  inset:0;

  z-index:100;

  pointer-events:none;
}

#top-left{
  position:absolute;

  top:12px;
  left:12px;

  background:#171322e8;

  border:2px solid #ffffff35;

  border-radius:12px;

  padding:10px 14px;

  font-weight:bold;
}

#timer{
  position:absolute;

  top:12px;
  right:12px;

  background:#171322e8;

  border:2px solid #ffffff35;

  border-radius:12px;

  padding:10px 14px;

  font-weight:bold;
}


/* =========================
   CHAT
========================= */

#chat{
  position:absolute;

  right:12px;
  top:62px;

  width:230px;

  padding:10px;

  background:#171322dd;

  border:2px solid #ffffff25;

  border-radius:13px;

  pointer-events:auto;
}

#chatLog{
  height:80px;

  overflow-y:auto;

  font-size:12px;

  margin-bottom:7px;
}

.chat-row{
  display:flex;
  gap:5px;
}

#chatInput{
  min-width:0;
  flex:1;

  padding:7px;

  border-radius:8px;

  border:1px solid #ffffff25;

  background:#ffffff10;

  color:white;

  outline:none;
}

#chatSend{
  border:0;

  border-radius:8px;

  padding:7px;

  cursor:pointer;
}


/* =========================
   DIÁLOGO
========================= */

#dialog{
  position:absolute;

  left:8%;
  right:8%;

  bottom:75px;

  background:#171322f5;

  border:2px solid #ffffff35;

  border-radius:17px;

  padding:16px;

  display:none;

  pointer-events:auto;
}

#dialog.show{
  display:block;
}

#dialogTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:7px;
}

#dialogText{
  color:#ddd;
  line-height:1.5;
  white-space:pre-line;
}

.dialog-buttons{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.dialog-buttons button{
  padding:9px 13px;

  border-radius:10px;

  border:0;

  cursor:pointer;

  font-weight:bold;
}

#replay{
  background:#bd8eea;
}

#closeDialog{
  background:#ffffff18;
  color:white;

  border:1px solid #ffffff25 !important;
}


/* =========================
   CONTROLES
========================= */

#interact{
  position:absolute;

  right:15px;
  bottom:15px;

  padding:13px 18px;

  border:0;

  border-radius:12px;

  background:#bd8eea;

  color:#201426;

  font-weight:bold;

  pointer-events:auto;

  cursor:pointer;
}

#mobileControls{
  position:absolute;

  left:12px;
  bottom:12px;

  display:grid;

  grid-template-columns:
    48px 48px 48px;

  gap:5px;

  pointer-events:auto;
}

#mobileControls button{
  width:48px;
  height:48px;

  border-radius:11px;

  border:1px solid #ffffff30;

  background:#171322cc;

  color:white;

  font-size:19px;

  font-weight:bold;
}

#mobileUp{
  grid-column:2;
}

#mobileLeft{
  grid-column:1;
}

#mobileDown{
  grid-column:2;
}

#mobileRight{
  grid-column:3;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #chat{
    width:190px;
    top:60px;
  }

  #dialog{
    left:4%;
    right:4%;
  }

  .npc-name{
    font-size:12px;
  }

}
</style>
</head>

  document.getElementById("dialogTitle");

const dialogText =
  document.getElementById("dialogText");


/* =====================================================
   ESTADO
===================================================== */

let playerImage =
  "";

let playerName =
  "Jogador";

let x =
  1750;

let y =
  1250;

let keys =
  new Set();

let lastNpc =
  null;

let lastAudio =
  null;

let portalOpen =
  false;

let endTime =
  0;


/* =====================================================
   ESCOLHER IMAGEM DO PLAYER
===================================================== */

playerImageInput.addEventListener(
  "change",
  function(){

    const file =
      playerImageInput.files[0];

    if(!file){

      return;

    }


    if(!file.type.startsWith("image/")){

      alert(
        "Escolha uma imagem PNG, JPG, WEBP ou GIF."
      );

      playerImageInput.value =
        "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(){

        playerImage =
          reader.result;

        playerPreview.src =
          playerImage;

        previewArea.classList.add(
          "show"
        );

        fileName.textContent =
          file.name;

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   COMEÇAR
===================================================== */

document
  .getElementById("startGame")
  .addEventListener(
    "click",
    startGame
  );


function startGame(){

  playerName =
    playerNameInput.value.trim() ||
    "Jogador";


  /*
     Se o usuário não escolheu imagem,
     usa uma imagem de fallback.
  */

  if(playerImage){

    player.src =
      playerImage;

  }else{

    player.src =
      "data:image/svg+xml;charset=utf-8," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="100"
          height="120"
        >
          <text
            x="50"
            y="75"
            text-anchor="middle"
            font-size="65"
          >
            🐱
          </text>
        </svg>
      `);

  }


  playerNameTag.textContent =
    playerName;


  nameBadge.textContent =
    playerName;


  playerNameTag.style.display =
    "block";


  menu.style.display =
    "none";

  game.hidden =
    false;


  endTime =
    Date.now() + 15000;


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   TECLADO
===================================================== */

window.addEventListener(
  "keydown",
  function(event){

    const movementKeys = [

      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",

      "w",
      "a",
      "s",
      "d",

      "W",
      "A",
      "S",
      "D"

    ];


    if(
      movementKeys.includes(
        event.key
      )
    ){

      event.preventDefault();

      keys.add(
        event.key
      );

    }


    if(
      event.key.toLowerCase()
      === "e"
    ){

      interact();

    }

  }
);


window.addEventListener(
  "keyup",
  function(event){

    keys.delete(
      event.key
    );

  }
);


/* =====================================================
   CONTROLES MOBILE
===================================================== */

document
  .querySelectorAll(
    "#mobileControls button"
  )
  .forEach(button => {

    button.addEventListener(
      "pointerdown",
      function(){

        keys.add(
          button.dataset.key
        );

      }
    );


    button.addEventListener(
      "pointerup",
      function(){

        keys.delete(
          button.dataset.key
        );

      }
    );


    button.addEventListener(
      "pointercancel",
      function(){

        keys.delete(
          button.dataset.key
        );

      }
    );


    button.addEventListener(
      "pointerleave",
      function(){

        keys.delete(
          button.dataset.key
        );

      }
    );

  });


/* =====================================================
   NPC MAIS PRÓXIMO
===================================================== */

function nearestNpc(){

  let nearest =
    null;

  let bestDistance =
    Infinity;


  document
    .querySelectorAll(".npc")
    .forEach(npc => {

      const npcX =
        npc.offsetLeft + 75;

      const npcY =
        npc.offsetTop + 65;


      const distance =
        Math.hypot(
          npcX - x,
          npcY - y
        );


      if(
        distance < bestDistance
      ){

        bestDistance =
          distance;

        nearest =
          npc;

      }

    });


  if(
    bestDistance < 190
  ){

    return nearest;

  }


  return null;

}


/* =====================================================
   INTERAÇÃO
===================================================== */

document
  .getElementById("interact")
  .addEventListener(
    "click",
    interact
  );


function interact(){

  const npc =
    nearestNpc();


  if(!npc){

    return;

  }


  lastNpc =
    npc.dataset.id;


  dialogTitle.textContent =
    npc.querySelector(
      ".npc-name"
    ).textContent;


  dialogText.textContent =
    NPC_TEXT[lastNpc] ||
    "Olá!";


  dialog.classList.add(
    "show"
  );


  /*
     Somente Yume e Robô
     possuem áudio neste momento.
  */

  playNpcAudio(
    lastNpc
  );

}


/* =====================================================
   ÁUDIO
===================================================== */

function playNpcAudio(id){

  if(lastAudio){

    lastAudio.pause();

    lastAudio.currentTime =
      0;

    lastAudio =
      null;

  }


  if(
    id !== "yume" &&
    id !== "robot"
  ){

    return;

  }


  const src =
    AUDIO[id];


  if(!src){

    return;

  }


  lastAudio =
    new Audio(src);


  lastAudio.preload =
    "auto";


  lastAudio.play()
    .catch(
      function(){

        console.log(
          "O áudio não pôde ser reproduzido."
        );

      }
    );

}


/* =====================================================
   REPETIR ÁUDIO
===================================================== */

document
  .getElementById("replay")
  .addEventListener(
    "click",
    function(){

      if(lastNpc){

        playNpcAudio(
          lastNpc
        );

      }

    }
  );


/* =====================================================
   FECHAR DIÁLOGO
===================================================== */

document
  .getElementById("closeDialog")
  .addEventListener(
    "click",
    function(){

      dialog.classList.remove(
        "show"
      );

    }
  );


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

function loop(){

  let dx =
    0;

  let dy =
    0;


  /* ESQUERDA */

  if(
    keys.has("ArrowLeft") ||
    keys.has("a") ||
    keys.has("A")
  ){

    dx--;

  }


  /* DIREITA */

  if(
    keys.has("ArrowRight") ||
    keys.has("d") ||
    keys.has("D")
  ){

    dx++;

  }


  /* CIMA */

  if(
    keys.has("ArrowUp") ||
    keys.has("w") ||
    keys.has("W")
  ){

    dy--;

  }


  /* BAIXO */

  if(
    keys.has("ArrowDown") ||
    keys.has("s") ||
    keys.has("S")
  ){

    dy++;

  }


  /* MOVIMENTO */

  if(dx || dy){

    const length =
      Math.hypot(
        dx,
        dy
      );


    x +=
      (dx / length) * 5;


    y +=
      (dy / length) * 5;

  }


  /* LIMITES DO MUNDO */

  x =
    Math.max(
      180,
      Math.min(
        3420,
        x
      )
    );


  y =
    Math.max(
      150,
      Math.min(
        2450,
        y
      )
    );


  /* POSIÇÃO DO PLAYER */

  player.style.left =
    (x - 52) +
    "px";


  player.style.top =
    (y - 62) +
    "px";


  /* POSIÇÃO DO NOME */

  playerNameTag.style.left =
    x +
    "px";


  playerNameTag.style.top =
    (y - 66) +
    "px";


  /* =====================
     CÂMERA
  ===================== */

  const screenWidth =
    game.clientWidth;

  const screenHeight =
    game.clientHeight;


  const worldWidth =
    3600;

  const worldHeight =
    2600;


  const maxCameraX =
    Math.max(
      0,
      worldWidth -
      screenWidth
    );


  const maxCameraY =
    Math.max(
      0,
      worldHeight -
      screenHeight
    );


  let cameraX =
    x -
    screenWidth / 2;


  let cameraY =
    y -
    screenHeight / 2;


  cameraX =
    Math.max(
      0,
      Math.min(
        maxCameraX,
        cameraX
      )
    );


  cameraY =
    Math.max(
      0,
      Math.min(
        maxCameraY,
        cameraY
      )
    );


  world.style.transform =
    "translate(" +
    (-cameraX) +
    "px," +
    (-cameraY) +
    "px)";


  /* =====================
     PORTAL
  ===================== */

  if(!portalOpen){

    const seconds =
      Math.max(
        0,
        Math.ceil(
          (
            endTime -
            Date.now()
          ) / 1000
        )
      );


    timer.textContent =
      "PORTAL EM " +
      seconds +
      "s";


    if(seconds <= 0){

      portalOpen =
        true;


      portal.classList.remove(
        "hidden"
      );


      timer.textContent =
        "PORTAL ABERTO!";

    }

  }


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
   CHAT
===================================================== */

const chatInput =
  document.getElementById(
    "chatInput"
  );

const chatLog =
  document.getElementById(
    "chatLog"
  );


document
  .getElementById("chatSend")
  .addEventListener(
    "click",
    sendChat
  );


chatInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter"
    ){

      sendChat();

    }

  }
);


function sendChat(){

  const message =
    chatInput.value.trim();


  if(!message){

    return;

  }


  const line =
    document.createElement(
      "div"
    );


  const bold =
    document.createElement(
      "b"
    );


  bold.textContent =
    playerName +
    ": ";


  line.appendChild(
    bold
  );


  line.appendChild(
    document.createTextNode(
      message
    )
  );


  chatLog.appendChild(
    line
  );


  chatLog.scrollTop =
    chatLog.scrollHeight;


  chatInput.value =
    "";

}

</script>
